<script>
// ============================================================
// 🔑 کلیدهای API JSONBin.io (از حساب شما)
// ============================================================
// این کلیدها را از پنل JSONBin.io کپی کنید
const JSONBIN_API_KEY = '$2a$10$hgfExok0PxKOY5vhOnGO2OJY387HPkei8sjKcKtBpNV69kkDzqOQC';
const JSONBIN_ACCESS_KEY = '$2a$10$Ee9yXX0q8b8EJLIUMBCg0.3H9os2d/5RSQy2hU.n5gv/aI.ngpO52';
  // 📦 Bin ID ثابت برای همه کاربران
const FIXED_BIN_ID = '6a68431ff5f4af5e29cb6009';

// ============================================================
// دیتابیس JSONBin.io
// ============================================================
class JSONBinDB {
  constructor(apiKey, accessKey) {
    this.apiKey = apiKey;
    this.accessKey = accessKey;
    this.binId = FIXED_BIN_ID;
    this.baseURL = 'https://api.jsonbin.io/v3';
    this.cache = {};
    this.pollingInterval = null;
    this.isPolling = false;
    this.listeners = [];
    this.connected = false;
  }

  async read() {
    if (!this.binId) {
      const saved = localStorage.getItem('taxapp_bin_id');
      if (saved) { this.binId = saved; } else { return null; }
    }
    try {
      const res = await fetch(`${this.baseURL}/b/${this.binId}/latest`, {
        headers: { 
          'X-Master-Key': this.apiKey, 
          'X-Access-Key': this.accessKey, 
          'Content-Type': 'application/json' 
        }
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      this.cache = data.record;
      this.connected = true;
      localStorage.setItem('taxapp_data', JSON.stringify(data.record));
      return data.record;
    } catch(e) {
      console.error('Read error:', e);
      this.connected = false;
      const local = localStorage.getItem('taxapp_data');
      if (local) { this.cache = JSON.parse(local); return this.cache; }
      return null;
    }
  }

  async write(data) {
    if (!this.binId) {
      const saved = localStorage.getItem('taxapp_bin_id');
      if (saved) { this.binId = saved; } else { return false; }
    }
    try {
      const res = await fetch(`${this.baseURL}/b/${this.binId}`, {
        method: 'PUT',
        headers: { 
          'Content-Type': 'application/json', 
          'X-Master-Key': this.apiKey, 
          'X-Access-Key': this.accessKey 
        },
        body: JSON.stringify(data)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      this.cache = data;
      this.connected = true;
      localStorage.setItem('taxapp_data', JSON.stringify(data));
      return true;
    } catch(e) {
      console.error('Write error:', e);
      this.connected = false;
      localStorage.setItem('taxapp_data', JSON.stringify(data));
      return false;
    }
  }

  async get(key) { const data = await this.read(); return data ? data[key] : null; }
  async set(key, value) { const data = await this.read(); if (!data) return false; data[key] = value; return await this.write(data); }

  async createBin(initialData) {
    try {
      const res = await fetch(`${this.baseURL}/b`, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json', 
          'X-Master-Key': this.apiKey, 
          'X-Access-Key': this.accessKey 
        },
        body: JSON.stringify(initialData)
      });
      if (!res.ok) {
        const err = await res.text();
        throw new Error('HTTP ' + res.status + ': ' + err);
      }
      const result = await res.json();
      this.binId = result.metadata.id;
      this.connected = true;
      localStorage.setItem('taxapp_bin_id', this.binId);
      localStorage.setItem('taxapp_data', JSON.stringify(initialData));
      return this.binId;
    } catch(e) {
      console.error('Create bin error:', e);
      this.connected = false;
      return null;
    }
  }

  loadBinId() { 
    const saved = localStorage.getItem('taxapp_bin_id'); 
    if (saved) { this.binId = saved; return true; } 
    return false; 
  }

  startRealtime(callback, interval = 5000) {
    if (this.pollingInterval) clearInterval(this.pollingInterval);
    this.isPolling = true;
    this.read().then(data => { if (data) { this.cache = data; callback(data); } });
    this.pollingInterval = setInterval(async () => {
      if (!this.isPolling) return;
      try {
        const data = await this.read();
        if (data && JSON.stringify(data) !== JSON.stringify(this.cache)) {
          this.cache = data;
          callback(data);
        }
      } catch(e) { console.error('Polling error:', e); }
    }, interval);
    this.listeners.push(callback);
  }

  stopRealtime() { 
    this.isPolling = false; 
    if (this.pollingInterval) { clearInterval(this.pollingInterval); this.pollingInterval = null; } 
    this.listeners = []; 
  }

  async backup() {
    const data = await this.read();
    if (!data) return null;
    const backupData = { version: '1.0', timestamp: new Date().toISOString(), data: data };
    const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; 
    a.download = `taxapp_backup_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    return backupData;
  }

  async restore(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const backupData = JSON.parse(e.target.result);
          if (!backupData.data || !backupData.version) { 
            reject(new Error('فرمت فایل نامعتبر است')); 
            return; 
          }
          const success = await this.write(backupData.data);
          if (success) { 
            this.cache = backupData.data; 
            resolve(backupData); 
          } else { 
            reject(new Error('خطا در بازیابی')); 
          }
        } catch(err) { reject(err); }
      };
      reader.onerror = () => reject(new Error('خطا در خواندن فایل'));
      reader.readAsText(file);
    });
  }

  async getStats() {
    if (!this.binId) return null;
    try {
      const res = await fetch(`${this.baseURL}/b/${this.binId}`, {
        headers: { 'X-Master-Key': this.apiKey, 'X-Access-Key': this.accessKey }
      });
      if (!res.ok) return null;
      const data = await res.json();
      return { 
        binId: data.metadata.id, 
        createdAt: data.metadata.createdAt, 
        size: data.metadata.size || 0, 
        records: data.metadata.recordCount || 0 
      };
    } catch(e) { return null; }
  }

  isConnected() { return this.connected; }
}

// ============================================================
// راه‌اندازی دیتابیس
// ============================================================
const db = new JSONBinDB(JSONBIN_API_KEY, JSONBIN_ACCESS_KEY);
let dbStatus = 'connecting';

// ============================================================
// داده‌های اولیه (کاهش یافته برای تست)
// ============================================================
var SEED_PENALTIES = [
  { id:"p1", title:"عدم پلمب دفاتر", description:"۲۰٪ مالیات متعلق", calcType:"percent", value:20, amnestyEligible:true, amnestyPercent:50, installmentEligible:true, maxInstallments:12, legalArticle:"م ۹۵ ق.م.م" },
  { id:"p2", title:"عدم تسلیم اظهارنامه", description:"۱۰٪ مالیات متعلق", calcType:"percent", value:10, amnestyEligible:false, amnestyPercent:0, installmentEligible:true, maxInstallments:6, legalArticle:"م ۱۰۰ ق.م.م" }

var SEED_OBLIGATIONS = [

  { id:"o2", title:"اظهارنامه عملکرد", appliesTo:["حقیقی"], fixed:true, description:"ارسال اظهارنامه", deadline:"پایان خرداد", penaltyIds:["p2"] }

  { id:"pl2", title:"مشاوره تخصصی", price:500000, duration:"۳۰ دقیقه", desc:"بررسی دقیق" }

var SEED_META = {

var LICENSE_DURATIONS = [{months:1,label:"۱ ماهه"},{months:6,label:"۶ ماهه"},{months:12,label:"۱۲ ماهه"}];

// ============================================================
// ذخیره‌سازی محلی
// ============================================================
var NS = "taxapp_v1::";
function lsGet(k){ try{ var raw=localStorage.getItem(NS+k); return raw===null?null:JSON.parse(raw); }catch(e){return null;} }
function lsSet(k,v){ try{ localStorage.setItem(NS+k,JSON.stringify(v)); return true; }catch(e){return false;} }
function getOrSeed(k,s){ var v=lsGet(k); if(v!==null) return v; lsSet(k,s); return s; }

var DB = { questions:[], obligations:[], penalties:[], templates:[], plans:[], meta:{}, leads:[], licenses:[], licenseLogs:[], users:{} };
function loadDB(){
  DB.questions = getOrSeed('questions', SEED_QUESTIONS);
  DB.obligations = getOrSeed('obligations', SEED_OBLIGATIONS);
  DB.penalties = getOrSeed('penalties', SEED_PENALTIES);
  DB.templates = getOrSeed('templates', SEED_TEMPLATES);
  DB.plans = getOrSeed('plans', SEED_PLANS);
  DB.meta = Object.assign({}, SEED_META, getOrSeed('meta', SEED_META));
  DB.leads = getOrSeed('leads', []);
  DB.licenses = getOrSeed('licenses', []);
  DB.licenseLogs = getOrSeed('licenseLogs', []);
  DB.users = getOrSeed('users', {});
}
function saveDB(key){ lsSet(key, DB[key]); db.set(key, DB[key]); }

// ============================================================
// توابع کمکی
// ============================================================
function genId(p){ return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7); }
var ADMIN_SECRET = "panel-x7q2z9";
function toman(n){ return (Number(n)||0).toLocaleString('fa-IR') + ' تومان'; }
function toFa(n){ return Number(n).toLocaleString('fa-IR'); }
var IRAN_MOBILE_RE = /^0?9\d{9}$/;
function esc(s){ return String(s===null||s===undefined?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function addMonthsIso(d, m){ var dt=new Date(d); dt.setMonth(dt.getMonth()+Number(m||0)); return dt.toISOString(); }

function ic(name, size, color){

function checkLicense(code){
  code=(code||'').trim();
  if(!code) return false;
  if(DB.meta.defaultLicenseEnabled!==false && code===(DB.meta.defaultLicenseCode||'123')) return true;
  var lic=DB.licenses.filter(function(l){return l.code===code;})[0];
  if(!lic) return false;
  if(lic.expiresAt && new Date(lic.expiresAt).getTime()<Date.now()) return false;
  return true;
}
function isLicenseVerified(){ var code=lsGet('license_ok'); return code ? checkLicense(code) : false; }
function setLicenseVerified(code){ lsSet('license_ok', code); }
function clearLicenseVerified(){ try{ localStorage.removeItem(NS+'license_ok'); }catch(e){} }

function calcAmount(p, input){
  if(!p) return 0;
  if(p.calcType==='fixed') return p.value;
  if(p.calcType==='percent') return (Number(input&&input.base)||0)*(p.value/100);
  if(p.calcType==='permonth') return p.value*(Number(input&&input.months)||0);
  if(p.calcType==='permonth_percent') return (Number(input&&input.base)||0)*(p.value/100)*(Number(input&&input.months)||0);
  return 0;
}
function calcTypeLabel(t){
  if(t==='fixed') return 'مبلغ ثابت';
  if(t==='percent') return 'درصدی';
  if(t==='permonth') return 'مبلغ ثابت هر ماه';
  if(t==='permonth_percent') return 'درصدی هر ماه';
  return t;
}

function sendLeadEmail(lead, notifyEmail){
  if(!notifyEmail) return Promise.resolve({ok:false});
  return fetch('https://formsubmit.co/ajax/'+encodeURIComponent(notifyEmail), {
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify({
      _subject:'درخواست مشاوره جدید — '+lead.name,
      "نام":lead.name,"شماره_تماس":lead.phone,
      "نوع_مودی":lead.personType||'-',
      "بسته_انتخابی":lead.planTitle||'-',
      "مجموع_جرایم":toman(lead.totalRaw),
      "توضیحات":lead.note||'-'
    })
  }).then(function(res){ return res.ok ? {ok:true} : {ok:false}; }).catch(function(){ return {ok:false}; });
}

function orderedQuestionsFor(pt){ return DB.questions.filter(function(q){ return !q.appliesTo || q.appliesTo.indexOf(pt)!==-1; }).slice().sort(function(a,b){ return (a.order||0)-(b.order||0); }); }
function currentQuestion(){ var qs=orderedQuestionsFor(S.wiz.personType); return qs.filter(function(q){ return q.id===S.wiz.qId; })[0]||null; }
function nextQuestionAfter(qId){ var qs=orderedQuestionsFor(S.wiz.personType); var idx=qs.findIndex(function(q){return q.id===qId;}); return (idx===-1||idx+1>=qs.length)?null:qs[idx+1]; }
function derivedObligationIds(){ var ids={}; Object.keys(S.wiz.answers).forEach(function(qId){ var optId=S.wiz.answers[qId]; var q=DB.questions.filter(function(x){return x.id===qId;})[0]; var opt=q&&q.options.filter(function(o){return o.id===optId;})[0]; (opt&&opt.obligationIds||[]).forEach(function(id){ ids[id]=true; }); }); return ids; }
function fixedObligations(){ return DB.obligations.filter(function(o){ return o.fixed && (!o.appliesTo || o.appliesTo.indexOf(S.wiz.personType)!==-1); }); }
function derivedObligations(){ var ids=derivedObligationIds(); var fixedIds={}; fixedObligations().forEach(function(o){ fixedIds[o.id]=true; }); return DB.obligations.filter(function(o){ return (ids[o.id]||fixedIds[o.id]) && (!o.appliesTo || o.appliesTo.indexOf(S.wiz.personType)!==-1); }); }
function relatedPenaltyIds(){ var ids={}; derivedObligations().forEach(function(o){ (o.penaltyIds||[]).forEach(function(id){ ids[id]=true; }); }); return ids; }
function selectedPenalties(){ return DB.penalties.filter(function(p){ return S.wiz.selected[p.id] && S.wiz.selected[p.id].checked; }); }
function totalRawAmount(){ return selectedPenalties().reduce(function(s,p){ return s+calcAmount(p,S.wiz.selected[p.id]); },0); }
function totalAmnestyAmount(){ return selectedPenalties().reduce(function(s,p){ var amt=calcAmount(p,S.wiz.selected[p.id]); return s+(p.amnestyEligible?amt*(1-p.amnestyPercent/100):amt); },0); }
function buildLayeha(){ var tpl=DB.templates.filter(function(t){return t.id===S.wiz.templateId;})[0]||DB.templates[0]; if(!tpl) return ''; var list=selectedPenalties().map(function(p,i){ return (i+1)+'. '+p.title+' ('+(p.legalArticle||'')+') — '+toman(calcAmount(p,S.wiz.selected[p.id])); }).join('\n'); return tpl.body.split('{{taxpayerType}}').join(S.wiz.personType||'—').split('{{penaltiesList}}').join(list||'—').split('{{totalRaw}}').join(toman(totalRawAmount())).split('{{totalAmnesty}}').join(toman(totalAmnestyAmount())).split('{{date}}').join(new Date().toLocaleDateString('fa-IR')); }

function startWizard(type){ if(!hasQuotaOrLicense()){ S.wiz.step='quota'; render(); window.scrollTo(0,0); return; } registerQueryUsage(); S.wiz.personType=type; S.wiz.answers={}; var qs=orderedQuestionsFor(type); S.wiz.qId=qs.length?qs[0].id:null; S.wiz.step=qs.length?'questions':'obligations'; render(); }

var WIZ_STEPS=["intro","questions","obligations","penalties","calc","layeha","consult"];
var WIZ_LABELS=["سوالات","تکالیف شما","انتخاب جرایم","محاسبه","نمونه لایحه","مشاوره"];
function renderProgressTabs(){
  if(S.wiz.step==='intro'||S.wiz.step==='quota') return '';
  var effectiveStep=S.wiz.step==='license'?'penalties':S.wiz.step;
  var stepIndex=WIZ_STEPS.indexOf(effectiveStep);
  var html='<div class="progress-tabs">';
  WIZ_LABELS.forEach(function(label,i){ var idx=i+1; var active=stepIndex===idx; var done=stepIndex>idx; html+='<div class="progress-tab '+(active?'active':(done?'done':''))+'">'+(done?ic('check',12):'')+'<span>'+label+'</span></div>'; });
  html+='</div>'; return html;
}
function renderProgressTabsSafeEmpty(){ return ''; }

function renderUserWizard(){
  if(S.wiz.step==='intro' && !hasQuotaOrLicense()) return renderProgressTabsSafeEmpty()+renderQuotaGate();
  var step=S.wiz.step, body='';
  if(step==='intro') body=renderStepIntro();
  else if(step==='quota') body=renderQuotaGate();
  else if(step==='questions') body=renderStepQuestions();
  else if(step==='obligations') body=renderStepObligations();
  else if(step==='license') body=renderLicenseGateStep();
  else if(step==='penalties') body=renderStepPenalties();
  else if(step==='calc') body=renderStepCalc();
  else if(step==='layeha') body=renderStepLayeha();
  else if(step==='consult') body=renderStepConsult();
  return renderProgressTabs()+body;
}

async function doBackup(){ try { S.backupMsg='در حال...'; render(); var result=await db.backup(); S.backupMsg=result?'✅ پشتیبان تهیه شد':'❌ خطا'; } catch(e){ S.backupMsg='❌ خطا'; } render(); setTimeout(function(){ S.backupMsg=''; render(); },3000); }
async function doRestore(){ var fileInput=document.getElementById('restoreFileInput'); if(!fileInput||!fileInput.files||fileInput.files.length===0){ S.restoreMsg='⚠️ فایل انتخاب کنید.'; render(); return; } if(!confirm('داده‌ها بازنویسی می‌شوند. ادامه؟')) return; try { S.restoreMsg='در حال...'; render(); var result=await db.restore(fileInput.files[0]); if(result&&result.data){ Object.keys(result.data).forEach(function(key){ if(DB[key]!==undefined){ DB[key]=result.data[key]; lsSet(key,result.data[key]); } }); S.restoreMsg='✅ بازیابی شد!'; setTimeout(function(){ window.location.reload(); },1500); } else { S.restoreMsg='❌ خطا'; } } catch(e){ S.restoreMsg='❌ خطا: '+e.message; } render(); setTimeout(function(){ S.restoreMsg=''; render(); },4000); }
async function refreshStats(){ S.dbStats=await db.getStats(); render(); }

function saveSettings(){ var ids=['brandNameInput','taglineInput','phoneInput','whatsappInput','notifyEmailInput','adminPasswordInput','adTextInput','freeQueryLimitInput']; var vals={}; ids.forEach(function(id){ var el=document.getElementById(id); if(el) vals[id]=el.value; }); DB.meta.brandName=vals.brandNameInput||DB.meta.brandName; DB.meta.tagline=vals.taglineInput||''; DB.meta.phone=vals.phoneInput||''; DB.meta.whatsapp=vals.whatsappInput||''; DB.meta.notifyEmail=vals.notifyEmailInput||''; DB.meta.adminPassword=vals.adminPasswordInput||'123456'; DB.meta.adText=vals.adTextInput||''; DB.meta.freeQueryLimit=Math.max(0,parseInt(vals.freeQueryLimitInput,10)||0); var adEl=document.getElementById('adEnabledInput'); DB.meta.adEnabled=adEl?adEl.checked:true; saveDB('meta'); S.settingsSaved=true; render(); setTimeout(function(){ S.settingsSaved=false; render(); },1800); }

// ============================================================
// فرم‌های مدیریت
// ============================================================
var EMPTY_MAKERS={
  question:function(){ return {id:genId('q'), order:(DB.questions.length+1), text:'', appliesTo:['حقیقی','حقوقی'], options:[{id:genId('opt'), label:'بله', obligationIds:[], end:false}, {id:genId('opt'), label:'خیر', obligationIds:[], end:false}]}; },
  obligation:function(){ return {id:genId('o'), title:'', appliesTo:['حقیقی','حقوقی'], fixed:false, description:'', deadline:'', penaltyIds:[]}; },
  penalty:function(){ return {id:genId('p'), title:'', description:'', calcType:'fixed', value:0, amnestyEligible:false, amnestyPercent:0, installmentEligible:false, maxInstallments:1, legalArticle:''}; },
  template:function(){ return {id:genId('t'), title:'', body:''}; },
  plan:function(){ return {id:genId('pl'), title:'', price:0, duration:'', desc:''}; }
};
var COLL_KEY={question:'questions', obligation:'obligations', penalty:'penalties', template:'templates', plan:'plans'};

function openAddForm(type){ S.formType=type; S.formMode='add'; S.formId=null; S.form=EMPTY_MAKERS[type](); render(); window.scrollTo(0,0); }
function openEditForm(type,id){ var coll=DB[COLL_KEY[type]]; var item=coll.filter(function(x){return x.id===id;})[0]; if(!item) return; S.formType=type; S.formMode='edit'; S.formId=id; S.form=clone(item); render(); window.scrollTo(0,0); }
function cancelForm(){ S.formType=null; S.formMode=null; S.formId=null; S.form={}; render(); }
function deleteItem(type,id){ if(!confirm('حذف شود؟')) return; var key=COLL_KEY[type]; DB[key]=DB[key].filter(function(x){return x.id!==id;}); saveDB(key); render(); }
function saveForm(){ var key=COLL_KEY[S.formType]; if(S.formType==='question' && !S.form.text.trim()){ alert('متن را وارد کنید.'); return; } if((S.formType==='obligation'||S.formType==='penalty'||S.formType==='template'||S.formType==='plan') && !S.form.title.trim()){ alert('عنوان را وارد کنید.'); return; } if(S.formType==='plan'){ S.form.price=Number(S.form.price)||0; } if(S.formType==='question'){ S.form.order=Number(S.form.order)||1; } if(S.formType==='penalty'){ S.form.value=Number(S.form.value)||0; S.form.amnestyPercent=Number(S.form.amnestyPercent)||0; S.form.maxInstallments=Number(S.form.maxInstallments)||1; } if(S.formMode==='add'){ DB[key].push(S.form); } else { DB[key]=DB[key].map(function(x){ return x.id===S.formId?S.form:x; }); } saveDB(key); cancelForm(); }
function toggleAppliesTo(kind){ var arr=S.form.appliesTo||[]; var idx=arr.indexOf(kind); if(idx===-1) arr=arr.concat([kind]); else arr=arr.filter(function(x){return x!==kind;}); S.form.appliesTo=arr; render(); }
function toggleObligationFixed(checked){ S.form.fixed=checked; render(); }
function toggleMultiId(field,id){ var arr=S.form[field]||[]; var idx=arr.indexOf(id); if(idx===-1) arr=arr.concat([id]); else arr=arr.filter(function(x){return x!==id;}); S.form[field]=arr; render(); }
function renderMultiCheck(allItems, selectedIds, field){ return '<div class="multi-check">'+allItems.map(function(item){ var checked=(selectedIds||[]).indexOf(item.id)!==-1; return '<label class="checkbox-row"><input type="checkbox" '+(checked?'checked':'')+' onchange="toggleMultiId(\''+field+'\',\''+item.id+'\')" /><span>'+esc(item.title||item.text)+'</span></label>'; }).join('')+'</div>'; }

// ============================================================
// راه‌اندازی برنامه
// ============================================================
async function boot(){
  loadDB();
  checkAdminHash();
  if(!S.wiz.lead.planId && DB.plans[0]) S.wiz.lead.planId=DB.plans[0].id;
  if(!S.wiz.templateId && DB.templates[0]) S.wiz.templateId=DB.templates[0].id;
  restoreAuthSession();

  try {
    dbStatus='connecting';
    render();
    
    // بررسی آیا Bin ID وجود دارد
    if(!db.loadBinId()){
      // ایجاد Bin جدید
      var initialData={ 
        questions:DB.questions, 
        obligations:DB.obligations, 
        penalties:DB.penalties, 
        templates:DB.templates, 
        plans:DB.plans, 
        meta:DB.meta, 
        leads:DB.leads, 
        licenses:DB.licenses, 
        licenseLogs:DB.licenseLogs, 
        users:DB.users 
      };
      var binId = await db.createBin(initialData);
      if(binId){
        dbStatus='online';
        console.log('✅ Bin جدید ساخته شد! ID:', binId);
      } else {
        dbStatus='offline';
        console.warn('⚠️ ایجاد Bin ناموفق، از localStorage استفاده می‌شود');
      }
    } else {
      // خواندن داده‌ها از Bin موجود
      var data = await db.read();
      if(data){
        Object.keys(data).forEach(function(k){ 
          if(DB[k]!==undefined){ 
            DB[k]=data[k]; 
            lsSet(k,data[k]); 
          } 
        });
        dbStatus='online';
        console.log('✅ داده‌ها از JSONBin بارگذاری شد!');
      } else {
        dbStatus='offline';
        console.warn('⚠️ خواندن داده‌ها ناموفق، از localStorage استفاده می‌شود');
      }
    }
    
    // شروع هماهنگی لحظه‌ای
    db.startRealtime(function(data){ 
      if(data){ 
        Object.keys(data).forEach(function(k){ 
          if(DB[k]!==undefined){ 
            DB[k]=data[k]; 
          } 
        }); 
        dbStatus='online'; 
        render(); 
      } 
    }, 5000);
    
  } catch(e){ 
    console.error('خطای دیتابیس:', e); 
    dbStatus='error'; 
  }

  // دریافت آمار دیتابیس
  setTimeout(async function(){ 
    S.dbStats = await db.getStats(); 
    render(); 
  }, 2000);
  
  render();
}

if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
</script>
