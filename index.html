function hashParts(){
  var h = (window.location.hash || '').replace(/^#\/?/, '');

}
function go(path){
  var target = '#/' + path;
  if (window.location.hash === target) { onRoute(); render(); }
  else { window.location.hash = target; }
  window.scrollTo(0,0);
}
function onRoute(){
  var parts = hashParts();
  if (parts[0] === 'admin') {
    S.route = 'admin';

function calcAmount(p, input){
  if(!p) return 0;
  if(p.calcType==='fixed') return p.value;
  if(p.calcType==='percent') return (Number(input&&input.base)||0)*(p.value/100);
  if(p.calcType==='permonth') return p.value*(Number(input&&input.months)||0);
  if(p.calcType==='permonth_percent') return (Number(input&&input.base)||0)*(p.value/100)*(Number(input&&input.months)||0);
  return 0;
}
function calcTypeLabel(t){
  if(t==='fixed') return 'مبلغ ثابت';
  if(t==='percent') return 'درصدی';
  if(t==='permonth') return 'مبلغ ثابت هر ماه';
  if(t==='permonth_percent') return 'درصدی هر ماه';
  return t;
}

async function submitAuth(){
  var nameEl=document.getElementById('authNameInput'), phoneEl=document.getElementById('authPhoneInput');
  var name=nameEl?nameEl.value.trim():'', phone=phoneEl?phoneEl.value.trim():'';
  if(!name){ S.authError='نام را وارد کنید.'; render(); return; }
  if(!IRAN_MOBILE_RE.test(phone)){ S.authError='شماره موبایل معتبر نیست.'; render(); return; }
  S.authLoading = true; S.authError=''; render();
  try{
    var res = await Api.register(name, phone);
    apiStatus = 'online';
    var key = phone.replace(/^0/,'');
    S.authPhone = key; S.authName = name; S.remaining = res.remaining;
    lsSet('auth_phone', key); lsSet('auth_name', name);
    S.authLoading = false;
    go('');
  }catch(e){
    apiStatus='offline';
    S.authLoading = false;
    S.authError = 'اتصال به سرور برقرار نشد. لطفاً دوباره تلاش کنید.';
    render();
  }
}

function currentQuestion(){ return CATALOG.questions.find(function(q){ return q.id===S.wiz.qId; }) || null; }
function fixedObligations(){ return CATALOG.obligations.filter(function(o){ return o.fixed && (!o.appliesTo || o.appliesTo.indexOf(S.wiz.personType)!==-1); }); }
function derivedObligations(){
  var fx={}; fixedObligations().forEach(function(o){ fx[o.id]=true; });
  return CATALOG.obligations.filter(function(o){ return (fx[o.id]||S.wiz.triggered[o.id]) && (!o.appliesTo || o.appliesTo.indexOf(S.wiz.personType)!==-1); });
}
function relatedPenalties(){
  var ids={};
  derivedObligations().forEach(function(o){ (o.penaltyIds||[]).forEach(function(id){ ids[id]=true; }); });
  return CATALOG.penalties.filter(function(p){ return ids[p.id]; });
}
function selectedPenalties(){ return relatedPenalties().filter(function(p){ return S.wiz.selected[p.id] && S.wiz.selected[p.id].checked; }); }
function totalRawAmount(){ return selectedPenalties().reduce(function(s,p){ return s+calcAmount(p,S.wiz.selected[p.id]); },0); }
function totalAmnestyAmount(){ return selectedPenalties().reduce(function(s,p){ var amt=calcAmount(p,S.wiz.selected[p.id]); return s+(p.amnestyEligible?amt*(1-p.amnestyPercent/100):amt); },0); }
function buildLayeha(){
  var tpl=CATALOG.templates.find(function(t){return t.id===S.wiz.templateId;})||CATALOG.templates[0];
  if(!tpl) return '';
  var list=selectedPenalties().map(function(p,i){ return (i+1)+'. '+p.title+' ('+(p.legalArticle||'')+') — '+toman(calcAmount(p,S.wiz.selected[p.id])); }).join('\n');
  return tpl.body.split('{{taxpayerType}}').join(S.wiz.personType||'—')
    .split('{{penaltiesList}}').join(list||'—')
    .split('{{totalRaw}}').join(toman(totalRawAmount()))
    .split('{{totalAmnesty}}').join(toman(totalAmnestyAmount()))
    .split('{{date}}').join(new Date().toLocaleDateString('fa-IR'));
}

function isLicenseVerified(){ return !!lsGet('license_ok'); }
function hasQuotaOrLicense(){ return (S.remaining===null || S.remaining>0) || isLicenseVerified(); }

async function startWizard(type){
  if (!hasQuotaOrLicense()) { go('wizard/quota'); return; }
  if (!isLicenseVerified()) {
    try { var r = await Api.usage(S.authPhone); S.remaining = r.remaining; apiStatus='online'; }
    catch(e){ apiStatus='offline'; }
  }
  S.wiz.personType = type;
  S.wiz.answers = {}; S.wiz.triggered = {};
  var root = (CATALOG.meta.rootQuestion || {})[type];
  S.wiz.qId = root || null;
  if (root) go('wizard/questions'); else go('wizard/obligations');
}

function handleAnswer(optId){
  var q = currentQuestion(); if(!q) return;
  var opt = q.options.find(function(o){ return o.id===optId; });
  if (!opt) return;
  S.wiz.answers[q.id] = optId;
  (opt.obligationIds||[]).forEach(function(id){ S.wiz.triggered[id]=true; });
  if (opt.nextId) { S.wiz.qId = opt.nextId; render(); }
  else { go('wizard/obligations'); }
}

function goStep(step){
  if (step==='penalties' && !isLicenseVerified()) { go('wizard/license'); return; }
  go('wizard/'+step);
}

function copyLayehaText(){
  var ta=document.getElementById('layehaTextArea'); var text=ta?ta.value:S.wiz.layehaText;
  var done=function(){ S.wiz.copyMsg='✅ کپی شد'; render(); setTimeout(function(){ S.wiz.copyMsg=''; render(); },1800); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(function(){ S.wiz.copyMsg='کپی خودکار پشتیبانی نشد.'; render(); }); }
  else { S.wiz.copyMsg='کپی خودکار پشتیبانی نشد.'; render(); }

async function submitLead(){

function renderProgressTabs(){
  if(S.wiz.step==='intro'||S.wiz.step==='quota') return '';
  var effectiveStep=S.wiz.step==='license'?'penalties':S.wiz.step;
  var stepIndex=WIZ_STEPS.indexOf(effectiveStep);
  var html='<div class="progress-tabs">';
  WIZ_LABELS.forEach(function(label,i){ var idx=i+1; var active=stepIndex===idx; var done=stepIndex>idx; html+='<div class="progress-tab '+(active?'active':(done?'done':''))+'">'+(done?ic('check',12):'')+'<span>'+label+'</span></div>'; });
  html+='</div>'; return html;

function renderUserWizard(){
  if(S.wiz.step==='intro' && !hasQuotaOrLicense()) return renderQuotaGate();
  var step=S.wiz.step, body='';
  if(step==='intro') body=renderStepIntro();
  else if(step==='quota') body=renderQuotaGate();
  else if(step==='questions') body=renderStepQuestions();
  else if(step==='obligations') body=renderStepObligations();
  else if(step==='license') body=renderLicenseGateStep();

async function tryAdminLogin(){
  var el=document.getElementById('adminPassInput'), val=el?el.value:'';
  S.adminLoading = true; S.adminLoginError=''; render();
  try{
    var res = await Api.adminLogin(val);
    apiStatus='online';
    S.adminToken = res.token;
    lsSet('admin_token', res.token);
    var data = await Api.adminGetData(res.token);
    S.adminData = data;
    S.adminAuthed = true; S.adminLoading=false;
    go('admin/dashboard');
  }catch(e){
    apiStatus = (e && e.status) ? 'online' : 'offline';
    S.adminLoading=false;
    S.adminLoginError = (e && e.status===401) ? 'رمز اشتباه است.' : 'خطا در برقراری ارتباط با سرور.';
    render();
  }
}
function logoutAdmin(){ S.adminAuthed=false; S.adminToken=null; S.adminData=null; lsDel('admin_token'); go(''); }

async function tryRestoreAdminSession(){
  var tok = lsGet('admin_token');
  if (!tok) return;
  try{
    var data = await Api.adminGetData(tok);
    S.adminToken = tok; S.adminData = data; S.adminAuthed = true;
  }catch(e){ lsDel('admin_token'); }
}

async function saveAdminData(){
  try{
    await Api.adminPutData(S.adminToken, S.adminData);
    apiStatus='online';
    return true;
  }catch(e){
    apiStatus='offline';
    if (e && e.status===401) { S.adminAuthed=false; lsDel('admin_token'); go(''); }
    return false;
  }
}
async function persistAndRender(successMsg){
  var ok = await saveAdminData();
  if (!ok) alert('⚠️ ذخیره روی سرور ناموفق بود. اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.');
  render();
  return ok;
}

function renderMultiCheckOpt(idx, selectedIds){
  return '<div class="multi-check">'+S.adminData.obligations.map(function(item){
    var checked=(selectedIds||[]).indexOf(item.id)!==-1;
    return '<label class="checkbox-row"><input type="checkbox" '+(checked?'checked':'')+' onchange="toggleQOptionObligation('+idx+',\''+item.id+'\')" /><span>'+esc(item.title)+'</span></label>';
  }).join('')+'</div>';
}
function toggleQOptionObligation(idx, obId){ var arr=S.form.options[idx].obligationIds||[]; var i=arr.indexOf(obId); if(i===-1) arr=arr.concat([obId]); else arr=arr.filter(function(x){return x!==obId;}); S.form.options[idx].obligationIds=arr; render(); }
function addQOption(){ S.form.options.push({id:genId('opt'), label:'', nextId:null, obligationIds:[]}); render(); }
function removeQOption(idx){ S.form.options=S.form.options.filter(function(_,i){return i!==idx;}); render(); }
function openAddQuestion(){ S.formType='question'; S.formMode='add'; S.formId=null; S.form={id:genId('q'), text:'', appliesTo:['حقیقی','حقوقی'], options:[{id:genId('opt'), label:'بله', nextId:null, obligationIds:[]},{id:genId('opt'), label:'خیر', nextId:null, obligationIds:[]}]}; render(); window.scrollTo(0,0); }
function openEditQuestion(id){ var q=S.adminData.questions.find(function(x){return x.id===id;}); if(!q) return; S.formType='question'; S.formMode='edit'; S.formId=id; S.form=clone(q); render(); window.scrollTo(0,0); }
async function deleteQuestion(id){
  if(!confirm('این سوال حذف شود؟ گزینه‌های سایر سوالات که به این سوال اشاره می‌کنند باید دستی اصلاح شوند.')) return;
  S.adminData.questions = S.adminData.questions.filter(function(x){return x.id!==id;});
  Object.keys(S.adminData.meta.rootQuestion||{}).forEach(function(k){ if(S.adminData.meta.rootQuestion[k]===id) S.adminData.meta.rootQuestion[k]=''; });
  await persistAndRender();
}
async function saveQuestionForm(){
  if(!S.form.text.trim()){ alert('متن سوال را وارد کنید.'); return; }
  if(!S.form.id.trim()){ alert('شناسه را وارد کنید.'); return; }
  var exists = S.adminData.questions.some(function(x){return x.id===S.form.id && S.formMode==='add';});
  if(exists){ alert('این شناسه تکراری است.'); return; }
  if(S.formMode==='add'){ S.adminData.questions.push(S.form); }
  else { S.adminData.questions = S.adminData.questions.map(function(x){ return x.id===S.formId?S.form:x; }); }
  cancelForm();
  await persistAndRender();
}
async function setRootQuestion(personType, qId){
  S.adminData.meta.rootQuestion = S.adminData.meta.rootQuestion || {};
  S.adminData.meta.rootQuestion[personType] = qId || '';
  await persistAndRender();
}

  var header=['نام','شماره','نوع مؤدی','بسته','جرایم','وضعیت','توضیحات','تاریخ'];
  var rows=S.adminData.leads.map(function(l){ return [l.name,l.phone,l.personType||'',l.planTitle||'',l.totalRaw||0,l.status||'جدید',(l.note||'').replace(/\n/g,' '),l.createdAt]; });
  var csv=[header].concat(rows).map(function(r){ return r.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(','); }).join('\r\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}); var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download='leads.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

function renderLicensesAdmin(){
  var d=S.adminData;
  var now=Date.now();
  var licenseRows=d.licenses.map(function(l){
    var expired=l.expiresAt && new Date(l.expiresAt).getTime()<now;
    var statusBadge=expired?'<span class="badge badge-red">منقضی</span>':'<span class="badge badge-green">فعال</span>';
    var durLabel=(LICENSE_DURATIONS.find(function(dd){return dd.months===l.durationMonths;})||{}).label||(toFa(l.durationMonths||0)+' ماهه');
    var sub=(l.note?esc(l.note)+' — ':'')+durLabel+' — ثبت: '+new Date(l.createdAt).toLocaleDateString('fa-IR')+(l.expiresAt?(' — انقضا: '+new Date(l.expiresAt).toLocaleDateString('fa-IR')):'')+' '+statusBadge;
    return '<div class="admin-row"><div class="row-main"><div class="row-title">'+esc(l.code)+'</div><div class="row-sub">'+sub+'</div></div>' +
      '<div class="row-actions"><button class="icon-btn danger" onclick="deleteLicense(\''+l.code+'\')">'+ic('trash',14,'var(--red)')+'</button></div></div>';
  }).join('');
  var logsRows=d.licenseLogs.slice().reverse().slice(0,25).map(function(l){ return '<div class="small-muted" style="padding:4px 0;border-bottom:1px solid var(--line);">کد <b>'+esc(l.code)+'</b> — '+new Date(l.at).toLocaleString('fa-IR')+'</div>'; }).join('');
  var durationRadios=LICENSE_DURATIONS.map(function(dd){ return '<label class="radio-row"><input type="radio" name="licDuration" '+(S.newLicenseDuration===dd.months?'checked':'')+' onchange="setNewLicenseDuration('+dd.months+')" /><span>'+dd.label+'</span></label>'; }).join('');
  return '<div class="card"><div class="section-title tight"><h2>🔑 لایسنس‌ها</h2></div><p class="muted" style="margin:8px 0 16px;">ساخت کدهای ۳، ۶ و ۱۲ ماهه</p>' +
    '<div class="block" style="margin-bottom:18px;"><label class="checkbox-row"><input type="checkbox" '+(d.meta.defaultLicenseEnabled!==false?'checked':'')+' onchange="toggleDefaultLicense(this.checked)" /><span style="font-weight:700;">لایسنس پیش‌فرض</span></label>' +
    '<div class="grid2" style="margin-top:10px;"><label class="field"><span class="field-label">کد پیش‌فرض</span><input type="text" id="defaultLicenseCodeInput" value="'+esc(d.meta.defaultLicenseCode||'123')+'" /></label><div style="align-self:end;"><button class="btn btn-ghost" onclick="saveDefaultLicenseCode()">ذخیره</button></div></div></div>' +
    '<div class="form-box"><div class="grid3"><label class="field"><span class="field-label">کد</span><input type="text" id="newLicenseCodeInput" placeholder="A1B2C3" /></label>' +
    '<label class="field"><span class="field-label">یادداشت</span><input type="text" id="newLicenseNoteInput" placeholder="نام مشتری" /></label>' +
    '<div style="align-self:end;display:flex;gap:8px;"><button class="btn btn-ghost" onclick="fillGeneratedLicenseCode()">تولید</button><button class="btn btn-primary" onclick="addLicense()">افزودن</button></div></div>' +
    '<div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;">'+durationRadios+'</div></div>' +
    '<div class="stack" style="margin-bottom:18px;">'+(licenseRows||'<p class="muted">کدی ثبت نشده است.</p>')+'</div>' +
    '<div class="section-title-row"><div style="font-weight:800;">گزارش استفاده</div><button class="btn btn-ghost btn-sm" onclick="clearLicenseLogs()">پاک</button></div>' +
    '<div class="block">'+(logsRows||'<span class="small-muted">موردی ثبت نشده است.</span>')+'</div></div>';
}
function genLicenseCode(){ var chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; var s=''; for(var i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)]; return s; }
function fillGeneratedLicenseCode(){ var el=document.getElementById('newLicenseCodeInput'); if(el) el.value=genLicenseCode(); }
function setNewLicenseDuration(m){ S.newLicenseDuration=Number(m); render(); }
async function addLicense(){
  var codeEl=document.getElementById('newLicenseCodeInput'), noteEl=document.getElementById('newLicenseNoteInput');
  var code=codeEl?codeEl.value.trim():'', note=noteEl?noteEl.value.trim():''; var months=S.newLicenseDuration||3;
  if(!code){ alert('کد را وارد کنید.'); return; }
  if(S.adminData.licenses.some(function(l){return l.code===code;})){ alert('کد تکراری است.'); return; }
  var createdAt=new Date().toISOString();
  S.adminData.licenses.push({code:code, note:note, durationMonths:months, createdAt:createdAt, expiresAt:addMonthsIso(createdAt, months)});
  await persistAndRender();
}
async function deleteLicense(code){ if(!confirm('حذف شود؟')) return; S.adminData.licenses = S.adminData.licenses.filter(function(l){return l.code!==code;}); await persistAndRender(); }
async function toggleDefaultLicense(checked){ S.adminData.meta.defaultLicenseEnabled=checked; await persistAndRender(); }
async function saveDefaultLicenseCode(){ var el=document.getElementById('defaultLicenseCodeInput'); S.adminData.meta.defaultLicenseCode=el?el.value.trim():'123'; await persistAndRender(); }
async function clearLicenseLogs(){ if(!confirm('پاک شود؟')) return; S.adminData.licenseLogs=[]; await persistAndRender(); }

// ============================================================
// تنظیمات
// ============================================================
function renderSettingsAdmin(){
  var m=S.adminData.meta;
  var userUrl=window.location.origin+window.location.pathname+'#/';
  var adminUrl=window.location.origin+window.location.pathname+'#/admin';
  return '<div class="card"><div class="section-title tight"><h2>⚙️ تنظیمات</h2></div>' +
    '<div class="alert-box info">🔗 لینک ورود کاربران: <code class="tpl-var">'+esc(userUrl)+'</code></div>' +
    '<div class="alert-box ok">🔐 لینک ورود مدیریت: <code class="tpl-var">'+esc(adminUrl)+'</code></div>' +
    '<div class="alert-box info" style="margin-top:8px;">رمز ورود پنل مدیریت از طریق Secret مربوط به Cloudflare Worker (متغیر <code class="tpl-var">ADMIN_PASSWORD</code>) تنظیم می‌شود، نه از این صفحه — برای تغییرش به راهنما مراجعه کنید.</div>' +
    '<div style="margin-top:14px;">' +
    '<label class="field"><span class="field-label">نام برند</span><input type="text" id="brandNameInput" value="'+esc(m.brandName)+'" /></label>' +
    '<label class="field"><span class="field-label">شعار</span><input type="text" id="taglineInput" value="'+esc(m.tagline)+'" /></label>' +
    '<label class="field"><span class="field-label">توضیح سئو (متا دیسکریپشن)</span><textarea id="seoDescInput" rows="2">'+esc(m.seoDescription||'')+'</textarea></label>' +
    '<label class="field"><span class="field-label">شماره تماس</span><input type="text" id="phoneInput" value="'+esc(m.phone)+'" /></label>' +
    '<label class="field"><span class="field-label">واتس‌اپ</span><input type="text" id="whatsappInput" value="'+esc(m.whatsapp||'')+'" placeholder="989121234567" /></label>' +
    '<label class="field"><span class="field-label">ایمیل دریافت درخواست‌ها</span><input type="text" id="notifyEmailInput" value="'+esc(m.notifyEmail||'')+'" /></label>' +
    '<label class="field"><span class="field-label">استعلام رایگان</span><input type="number" id="freeQueryLimitInput" value="'+esc(m.freeQueryLimit!=null?m.freeQueryLimit:3)+'" min="0" /></label>' +
    '<label class="field"><span class="field-label">متن تبلیغاتی (نوار متحرک)</span><textarea id="adTextInput" rows="2">'+esc(m.adText||'')+'</textarea></label>' +
    '<label class="checkbox-row"><input type="checkbox" id="adEnabledInput" '+(m.adEnabled!==false?'checked':'')+' /><span>نمایش نوار تبلیغاتی</span></label>' +
    '<div class="btn-row start"><button class="btn btn-primary" onclick="saveSettings()">ذخیره</button>'+(S.settingsSaved?'<span class="small-muted" style="color:var(--green);">✅ ذخیره شد</span>':'')+'</div></div></div>';
}
async function saveSettings(){
  var ids=['brandNameInput','taglineInput','seoDescInput','phoneInput','whatsappInput','notifyEmailInput','adTextInput','freeQueryLimitInput'];
  var vals={}; ids.forEach(function(id){ var el=document.getElementById(id); if(el) vals[id]=el.value; });
  var m=S.adminData.meta;
  m.brandName=vals.brandNameInput||m.brandName; m.tagline=vals.taglineInput||''; m.seoDescription=vals.seoDescInput||'';
  m.phone=vals.phoneInput||''; m.whatsapp=vals.whatsappInput||''; m.notifyEmail=vals.notifyEmailInput||'';
  m.adText=vals.adTextInput||''; m.freeQueryLimit=Math.max(0,parseInt(vals.freeQueryLimitInput,10)||0);
  var adEl=document.getElementById('adEnabledInput'); m.adEnabled=adEl?adEl.checked:true;
  await persistAndRender();
  S.settingsSaved=true; render(); setTimeout(function(){ S.settingsSaved=false; render(); },1800);
}

function renderGuideAdmin(){
  return '<div class="card"><div class="section-title tight"><h2>📖 راهنما</h2></div>' +
    '<div class="block"><div style="font-weight:800;">۱. معماری</div><div class="small-muted">همهٔ داده‌ها یک بلاک JSON در Cloudflare KV است. فرانت‌اند (این صفحه، روی گیت‌هاب) فقط با API که روی Cloudflare Worker است صحبت می‌کند.</div></div>' +
    '<div class="block"><div style="font-weight:800;">۲. تغییر رمز مدیریت</div><div class="small-muted">در پنل Cloudflare → Worker → Settings → Variables and Secrets → مقدار <code class="tpl-var">ADMIN_PASSWORD</code> را تغییر دهید.</div></div>' +
    '<div class="block"><div style="font-weight:800;">۳. درخت سوالات</div><div class="small-muted">در تب «درخت سوالات» برای هر سوال، بعد از هر پاسخ می‌توانید «سوال بعدی» و «تکالیفی که فعال می‌شود» را تعیین کنید. اگر «سوال بعدی» خالی بماند، مسیر پایان می‌یابد و کاربر مستقیم به صفحهٔ تکالیف می‌رود.</div></div>' +
    '<div class="block"><div style="font-weight:800;">۴. راهنمای کامل نصب</div><div class="small-muted">فایل <code class="tpl-var">README.md</code> همراه این پروژه را ببینید.</div></div></div>';
}

// ============================================================
// فرم‌های عمومی (تکالیف/جرایم/قالب/بسته)
// ============================================================
var EMPTY_MAKERS={
  obligation:function(){ return {id:genId('o'), title:'', appliesTo:['حقیقی','حقوقی'], fixed:false, description:'', deadline:'', penaltyIds:[]}; },
  penalty:function(){ return {id:genId('p'), title:'', description:'', calcType:'fixed', value:0, amnestyEligible:false, amnestyPercent:0, amnestyCondition:'', installmentEligible:false, maxInstallments:1, legalArticle:''}; },
  template:function(){ return {id:genId('t'), title:'', body:''}; },
  plan:function(){ return {id:genId('pl'), title:'', price:0, duration:'', desc:''}; }
};
var COLL_KEY={obligation:'obligations', penalty:'penalties', template:'templates', plan:'plans'};

function openAddForm(type){ S.formType=type; S.formMode='add'; S.formId=null; S.form=EMPTY_MAKERS[type](); render(); window.scrollTo(0,0); }
function openEditForm(type,id){ var coll=S.adminData[COLL_KEY[type]]; var item=coll.find(function(x){return x.id===id;}); if(!item) return; S.formType=type; S.formMode='edit'; S.formId=id; S.form=clone(item); render(); window.scrollTo(0,0); }
async function deleteItem(type,id){ if(!confirm('حذف شود؟')) return; var key=COLL_KEY[type]; S.adminData[key]=S.adminData[key].filter(function(x){return x.id!==id;}); await persistAndRender(); }
async function saveForm(){
  var key=COLL_KEY[S.formType];
  if((S.formType==='obligation'||S.formType==='penalty'||S.formType==='template'||S.formType==='plan') && !S.form.title.trim()){ alert('عنوان را وارد کنید.'); return; }
  if(S.formType==='plan'){ S.form.price=Number(S.form.price)||0; }
  if(S.formType==='penalty'){ S.form.value=Number(S.form.value)||0; S.form.amnestyPercent=Number(S.form.amnestyPercent)||0; S.form.maxInstallments=Number(S.form.maxInstallments)||1; }
  if(S.formMode==='add'){ S.adminData[key].push(S.form); }
  else { S.adminData[key]=S.adminData[key].map(function(x){ return x.id===S.formId?S.form:x; }); }
  cancelForm();
  await persistAndRender();
}
function toggleAppliesTo(kind){ var arr=S.form.appliesTo||[]; var idx=arr.indexOf(kind); if(idx===-1) arr=arr.concat([kind]); else arr=arr.filter(function(x){return x!==kind;}); S.form.appliesTo=arr; render(); }
function toggleMultiId(field,id){ var arr=S.form[field]||[]; var idx=arr.indexOf(id); if(idx===-1) arr=arr.concat([id]); else arr=arr.filter(function(x){return x!==id;}); S.form[field]=arr; render(); }
function renderMultiCheck(allItems, selectedIds, field){
  return '<div class="multi-check">'+allItems.map(function(item){
    var checked=(selectedIds||[]).indexOf(item.id)!==-1;
    return '<label class="checkbox-row"><input type="checkbox" '+(checked?'checked':'')+' onchange="toggleMultiId(\''+field+'\',\''+item.id+'\')" /><span>'+esc(item.title||item.text)+'</span></label>';
  }).join('')+'</div>';
}

// ============================================================
// راه‌اندازی برنامه
// ============================================================
async function boot(){
  onRoute();
  restoreAuthSession();
  render();

  try{
    CATALOG = await Api.getData();
    apiStatus = 'online';
  }catch(e){
    apiStatus = 'offline';
  }

  if (S.route === 'admin') {
    await tryRestoreAdminSession();
  }

  if (!S.wiz.lead.planId && CATALOG.plans && CATALOG.plans[0]) S.wiz.lead.planId = CATALOG.plans[0].id;
  if (!S.wiz.templateId && CATALOG.templates && CATALOG.templates[0]) S.wiz.templateId = CATALOG.templates[0].id;

  render();
}

if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
</script>
