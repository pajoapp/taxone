<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>دستیار تکالیف مالیاتی</title>
<meta name="description" content="ابزار خوداظهاری تکالیف و جرایم مالیاتی و درخواست مشاوره" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --ink:#1B2A45; --ink-soft:#4A5876; --paper:#F7F4EC; --paper-alt:#EFE9D8;
    --card:#FFFFFF; --gold:#B8862E; --gold-light:#E7C878; --red:#A23B3B;
    --red-soft:#F3E2E0; --green:#3F7A5D; --green-soft:#E1EDE5; --line:#DCD4BC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Vazirmatn', Tahoma, Arial, sans-serif;
    background:var(--paper); color:var(--ink);
    min-height:100vh; line-height:1.6;
  }
  ::selection{background:var(--gold-light);}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  .container{max-width:960px; margin:0 auto; padding:0 16px;}
  .hidden{display:none !important;}

  .site-header{border-bottom:1px solid var(--line); padding:18px 0;}
  .site-header .inner{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .brand-badge{width:44px; height:44px; border-radius:12px; background:var(--ink); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .brand-name{font-weight:800; font-size:16px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .brand-tagline{font-size:12px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:60vw;}
  .header-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}

  .disclaimer{font-size:12px; border-radius:12px; padding:10px 12px; display:flex; align-items:flex-start; gap:8px; background:var(--red-soft); color:var(--red); margin:14px 0 4px;}
  .warn-banner{font-size:12px; border-radius:12px; padding:10px 12px; display:flex; align-items:flex-start; gap:8px; background:#FCEFD1; color:#7a5b06; margin:0 0 14px;}
  .error-banner{font-size:12px; border-radius:12px; padding:10px 12px; display:flex; align-items:flex-start; gap:8px; background:#3a1414; color:#ffd7d0; margin:0 0 14px;}

  .site-footer{padding:24px 0 32px;}
  .site-footer .inner{border-top:1px solid var(--line); padding-top:14px; font-size:12px; text-align:center; color:var(--ink-soft);}

  .card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:0 1px 2px rgba(27,42,69,.05); margin-bottom:16px;}
  .card.narrow{max-width:440px; margin:24px auto;}

  .btn{display:inline-flex; align-items:center; gap:6px; border-radius:10px; padding:10px 16px; font-size:14px; font-weight:700; border:none; transition:transform .1s, opacity .15s;}
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.5; cursor:not-allowed; transform:none;}
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-gold{background:var(--gold); color:#fff;}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn-danger{background:var(--red-soft); color:var(--red);}
  .btn-sm{padding:7px 10px; font-size:12px; border-radius:8px;}
  .btn-row{display:flex; justify-content:space-between; gap:8px; margin-top:20px; flex-wrap:wrap;}
  .btn-row.start{justify-content:flex-start;}
  .icon-btn{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px; display:inline-flex; align-items:center; justify-content:center;}
  .icon-btn.danger{background:var(--red-soft); border:none;}

  .badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; white-space:nowrap;}
  .badge-gold{background:var(--gold-light); color:#5c4109;}
  .badge-red{background:var(--red-soft); color:var(--red);}
  .badge-green{background:var(--green-soft); color:var(--green);}
  .badge-ink{background:var(--paper-alt); color:var(--ink);}

  label.field{display:block; margin-bottom:14px;}
  .field-label{display:block; font-size:13.5px; font-weight:700; margin-bottom:6px; color:var(--ink);}
  .field-hint{display:block; font-size:11.5px; margin-top:5px; color:var(--ink-soft);}
  .field-error{display:block; font-size:11.5px; margin-top:5px; color:var(--red);}
  input[type=text], input[type=password], input[type=number], input[type=tel], select, textarea{
    border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px;
    padding:10px 12px; font-size:14px; font-family:inherit; width:100%; outline:none;
  }
  input:focus, select:focus, textarea:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(184,134,46,.15);}
  textarea{resize:vertical; line-height:1.8;}
  .checkbox-row{display:flex; align-items:center; gap:8px; font-size:13.5px; padding:4px 0; cursor:pointer; user-select:none;}
  .checkbox-row input{width:16px; height:16px; flex-shrink:0;}
  .radio-row{display:flex; align-items:center; gap:8px; font-size:13.5px; padding:4px 0; cursor:pointer; user-select:none;}
  .radio-row input{width:16px; height:16px; flex-shrink:0;}
  .search-wrap{position:relative; max-width:320px;}
  .search-wrap input{padding-left:12px; padding-right:34px;}
  .search-wrap .search-icon{position:absolute; right:10px; top:50%; transform:translateY(-50%); color:var(--ink-soft); pointer-events:none;}

  .section-eyebrow{font-size:11.5px; font-weight:800; color:var(--gold); margin-bottom:4px; letter-spacing:.02em;}
  .section-title{display:flex; align-items:center; gap:8px; margin:0 0 18px;}
  .section-title h2{font-size:19px; font-weight:800; margin:0; color:var(--ink);}
  .section-title.tight{margin-bottom:0;}
  .section-title-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; flex-wrap:wrap;}

  .muted{color:var(--ink-soft); font-size:13.5px;}
  .small-muted{color:var(--ink-soft); font-size:12px;}

  .grid2{display:grid; grid-template-columns:1fr; gap:14px;}
  .grid3{display:grid; grid-template-columns:1fr; gap:12px;}
  .grid4{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  @media(min-width:680px){
    .grid2{grid-template-columns:1fr 1fr;}
    .grid3{grid-template-columns:repeat(3,1fr);}
    .grid4{grid-template-columns:repeat(4,1fr);}
  }
  .col-span-2{grid-column:1/-1;}

  .choice-card{text-align:right; border-radius:16px; padding:18px; border:1px solid var(--line); background:var(--paper-alt); transition:transform .12s; width:100%;}
  .choice-card:hover{transform:translateY(-2px);}
  .choice-card .title{font-weight:800; margin-top:8px; color:var(--ink);}
  .choice-card .desc{font-size:12px; margin-top:4px; color:var(--ink-soft);}

  .option-btn{display:block; width:100%; text-align:right; border-radius:12px; padding:12px 14px; border:1px solid var(--line); background:var(--paper-alt); color:var(--ink); font-weight:700; font-size:13.5px; margin-bottom:9px;}

  .progress-tabs{display:flex; gap:6px; margin-bottom:22px; overflow-x:auto; padding-bottom:4px;}
  .progress-tab{flex-shrink:0; display:flex; align-items:center; gap:5px; padding:6px 12px; border-radius:999px; font-size:11.5px; font-weight:800; background:var(--paper-alt); color:var(--ink-soft); white-space:nowrap;}
  .progress-tab.active{background:var(--ink); color:#fff;}
  .progress-tab.done{background:var(--green-soft); color:var(--green);}

  .block{border-radius:14px; padding:14px; background:var(--paper-alt);}
  .block + .block{margin-top:10px;}
  .block.outline-gold{border:1.5px solid var(--gold);}
  .block.outline-transparent{border:1.5px solid transparent;}
  .stack{display:flex; flex-direction:column; gap:10px;}

  .admin-tabs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .admin-tab{display:flex; align-items:center; gap:6px; padding:8px 13px; border-radius:999px; font-size:12px; font-weight:800; background:var(--paper-alt); color:var(--ink-soft); border:none;}
  .admin-tab.active{background:var(--ink); color:#fff;}

  .admin-row{border-radius:14px; padding:14px; background:var(--paper-alt); display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .admin-row .row-main{min-width:0; flex:1;}
  .admin-row .row-title{font-weight:800; font-size:13.5px; color:var(--ink);}
  .admin-row .row-sub{font-size:12px; margin-top:4px; line-height:1.8; color:var(--ink-soft);}
  .admin-row .row-actions{display:flex; gap:6px; flex-shrink:0;}

  .form-box{border-radius:14px; padding:16px; background:var(--paper-alt); margin-bottom:18px;}
  .opt-box{border-radius:10px; padding:10px; background:var(--card); border:1px solid var(--line); margin-bottom:8px;}
  .opt-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .multi-check{display:flex; flex-direction:column; gap:2px; max-height:150px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; padding:8px;}

  .stat-box{border-radius:14px; padding:14px; background:var(--paper-alt);}
  .stat-value{font-size:18px; font-weight:800; margin-top:8px; color:var(--ink);}
  .stat-label{font-size:12px; margin-top:4px; color:var(--ink-soft);}

  .summary-box{border-radius:14px; padding:14px; margin-top:8px; background:var(--ink); color:#fff;}
  .summary-row{display:flex; justify-content:space-between; font-size:13.5px;}
  .summary-row + .summary-row{margin-top:4px;}

  .lead-plan{text-align:right; border-radius:12px; padding:14px; border:1px solid var(--line); background:var(--card); width:100%;}
  .lead-plan.selected{border-color:var(--gold); background:var(--paper-alt);}
  .lead-plan .p-title{font-weight:800; font-size:13.5px; color:var(--ink);}
  .lead-plan .p-dur{font-size:12px; margin-top:3px; color:var(--ink-soft);}
  .lead-plan .p-price{font-weight:800; margin-top:8px;}
  .lead-plan .p-desc{font-size:12px; margin-top:5px; line-height:1.7; color:var(--ink-soft);}

  .success-box{border-radius:14px; padding:14px; background:var(--green-soft); color:var(--green);}
  .success-box .title-row{display:flex; align-items:center; gap:8px; font-weight:700;}

  .lock-wrap{display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:18px;}
  .lock-badge{width:52px; height:52px; border-radius:14px; background:var(--ink); display:flex; align-items:center; justify-content:center; margin-bottom:10px;}
  .lock-wrap h2{margin:0; font-size:17px; font-weight:800; color:var(--ink);}
  .lock-wrap p{margin:4px 0 0; font-size:12px; color:var(--ink-soft);}

  .alert-box{font-size:12px; border-radius:12px; padding:10px 12px; margin-top:10px;}
  .alert-box.error{background:var(--red-soft); color:var(--red);}
  .alert-box.info{background:var(--red-soft); color:var(--red); display:flex; gap:6px; align-items:flex-start;}
  .alert-box.ok{background:var(--green-soft); color:var(--green); display:flex; gap:6px; align-items:flex-start;}

  code.tpl-var{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:1px 6px; font-size:11.5px;}
  pre.code-block{background:#0f172a; color:#d8e2f3; border-radius:12px; padding:14px; font-size:12px; overflow-x:auto; direction:ltr; text-align:left; line-height:1.7;}

  svg.ic{flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spin{animation:spin 1s linear infinite;}
  .loading-wrap{min-height:60vh; display:flex; align-items:center; justify-content:center;}
  .loading-wrap .inner{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink-soft);}

  .ad-marquee{background:linear-gradient(90deg,#1B2A45,#3a2f12,#1B2A45); color:var(--gold-light); overflow:hidden; white-space:nowrap; padding:11px 0; border-radius:12px; margin:14px 0; border:1px solid var(--gold);}
  .ad-marquee .track{display:inline-block; padding-right:100%; animation:adscroll 20s linear infinite;}
  .ad-marquee:hover .track{animation-play-state:paused;}
  @keyframes adscroll{ 0%{transform:translateX(0);} 100%{transform:translateX(-100%);} }
  .ad-marquee .track span{padding:0 40px; font-size:14px; font-weight:800; letter-spacing:.01em;}

  .quota-pill{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:800; padding:4px 10px; border-radius:999px; background:var(--paper-alt); color:var(--ink-soft); margin-bottom:10px;}
  .sync-pill{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px;}
  .sync-pill.online{background:var(--green-soft); color:var(--green);}
  .sync-pill.offline{background:var(--red-soft); color:var(--red);}
  .sync-pill.connecting{background:var(--paper-alt); color:var(--ink-soft);}
</style>
</head>
<body>
<div id="app">
  <div class="loading-wrap"><div class="inner"><span>در حال بارگذاری...</span></div></div>
</div>

<script>
"use strict";
/* ============================================================
   دستیار تکالیف مالیاتی — نسخه استاتیک تک‌فایلی (بدون نیاز به بیلد)
   محل استقرار: GitHub Pages (یا هر هاست استاتیک دیگر)
   محل ذخیره‌سازی داده: Firebase Realtime Database (تنها منبع ذخیره خارجی)
   ============================================================ */

/* ============================================================
   تنظیمات Firebase
   این کلیدها همان کلیدهایی هستند که از پروژه Firebase شما کپی شده‌اند.
   نیازی به ساخت پروژه جدید نیست، اما برای اینکه هماهنگی بین کاربران/
   دستگاه‌های مختلف درست کار کند، باید دو مرحله زیر را در کنسول Firebase
   انجام دهید (کامل توضیح داده شده در بخش «راهنما» در پنل مدیریت):
     ۱) Authentication → Sign-in method → Anonymous را Enable کنید.
     ۲) Realtime Database → Rules را با محتوای زیر جایگزین و Publish کنید:
        {
          "rules": {
            "endtax_app_v1": {
              ".read": "auth != null",
              ".write": "auth != null"
            }
          }
        }
   بدون این دو مرحله، Firebase به‌طور پیش‌فرض نوشتن/خواندن را برای کاربران
   ناشناس رد می‌کند و به همین دلیل تغییرات فقط در همان مرورگری که ساخته
   شده ذخیره می‌ماند (چون به‌صورت محلی/localStorage نمایش داده می‌شود) و
   به بقیه کاربران و دستگاه‌ها نمی‌رسد.
   ============================================================ */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyAXtXkOCbstd3_MKYDbEmL-kbHfNTME_Rs",
  authDomain: "endtax-2d555.firebaseapp.com",
  databaseURL: "https://endtax-2d555-default-rtdb.firebaseio.com",
  projectId: "endtax-2d555",
  storageBucket: "endtax-2d555.firebasestorage.app",
  messagingSenderId: "989982113452",
  appId: "1:989982113452:web:87af975beaa8c266342909"
};
var FB_ROOT = "endtax_app_v1";
var FB_KEYS = ['questions','obligations','penalties','templates','plans','meta','leads','licenses','licenseLogs','users'];
var fbEnabled = false;
var fbApp = null;
var fbDb = null;
var fbAuthObj = null;
var fbAuthReady = false;
var fbSyncStatus = 'connecting'; /* connecting | online | offline | error */
var fbErrorMsg = '';

try{
  if(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('PASTE_') !== 0){
    fbApp = firebase.initializeApp(FIREBASE_CONFIG);
    fbDb = firebase.database();
    fbAuthObj = firebase.auth();
    fbEnabled = true;
  } else {
    fbSyncStatus = 'offline';
  }
}catch(e){
  console.error('Firebase init error', e);
  fbEnabled = false;
  fbSyncStatus = 'offline';
}

function handleFbWriteError(err){
  console.error('Firebase write error', err);
  fbSyncStatus = 'error';
  fbErrorMsg = 'ذخیره روی Firebase ناموفق بود (' + (err && (err.code||err.message) || 'خطای نامشخص') + '). به احتمال زیاد Rules دیتابیس یا فعال بودن Anonymous Auth را باید بررسی کنید — به بخش «راهنما» در پنل مدیریت مراجعه کنید.';
  render();
}
function handleFbReadError(err){
  console.error('Firebase read error', err);
  fbSyncStatus = 'error';
  fbErrorMsg = 'خواندن اطلاعات از Firebase ناموفق بود (' + (err && (err.code||err.message) || 'خطای نامشخص') + '). به احتمال زیاد Rules دیتابیس یا فعال بودن Anonymous Auth را باید بررسی کنید — به بخش «راهنما» در پنل مدیریت مراجعه کنید.';
  render();
}

/* برای هر کلید: اگر روی Firebase چیزی نبود، مقدار محلی فعلی (seed) را یک‌بار
   می‌نویسیم تا این مقدار به‌عنوان منبع مشترک برای همه کاربران باقی بماند؛
   سپس به تغییرات آینده گوش می‌دهیم. */
function fbSyncKey(key){
  if(!fbEnabled) return;
  var ref = fbDb.ref(FB_ROOT + '/' + key);
  ref.once('value').then(function(snap){
    if(!snap.exists()){
      ref.set(DB[key]).catch(handleFbWriteError);
    }
    ref.on('value', function(snap2){
      var val = snap2.val();
      if(val === null || val === undefined) return;
      DB[key] = (key === 'meta') ? Object.assign({}, SEED_META, val) : val;
      fbSyncStatus = 'online'; fbErrorMsg = '';
      render();
    }, handleFbReadError);
  }).catch(handleFbReadError);
}
function fbWrite(key){
  if(!fbEnabled) return;
  fbDb.ref(FB_ROOT + '/' + key).set(DB[key]).then(function(){
    fbSyncStatus = 'online'; fbErrorMsg = '';
  }).catch(handleFbWriteError);
}
function fbStartAllSync(){ FB_KEYS.forEach(fbSyncKey); }
function fbBoot(){
  if(!fbEnabled){ fbSyncStatus = 'offline'; return; }
  fbAuthObj.signInAnonymously().then(function(){
    fbAuthReady = true;
    fbSyncStatus = 'online';
    fbErrorMsg = '';
    fbStartAllSync();
    render();
  }).catch(function(err){
    console.error('Firebase anonymous sign-in error', err);
    fbSyncStatus = 'error';
    fbErrorMsg = 'ورود ناشناس (Anonymous Auth) به Firebase ناموفق بود (' + (err && err.code || '') + '). در کنسول Firebase باید Authentication → Sign-in method → Anonymous را Enable کنید — جزئیات در بخش «راهنما».';
    render();
  });
}

/*  آیکن‌های SVG ساده                                           */

function ic(name, size, color){
  size = size || 16; color = color || 'currentColor';
  var p = {
    lock:'<rect x="4" y="10" width="16" height="10" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3" fill="none"/>',
    check:'<path d="M4 12.5l5 5L20 6" fill="none"/>',
    alert:'<path d="M12 3l10 18H2L12 3z" fill="none"/><line x1="12" y1="9" x2="12" y2="14"/><circle cx="12" cy="17.2" r="1"/>',
    info:'<circle cx="12" cy="12" r="9" fill="none"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="8" r="1"/>',
    settings:'<circle cx="12" cy="12" r="3" fill="none"/><path d="M19 12a7 7 0 0 0-.2-1.6l2-1.6-2-3.4-2.4.7a7 7 0 0 0-2.8-1.6L13 2h-2l-.6 2.5a7 7 0 0 0-2.8 1.6l-2.4-.7-2 3.4 2 1.6a7 7 0 0 0 0 3.2l-2 1.6 2 3.4 2.4-.7a7 7 0 0 0 2.8 1.6L11 22h2l.6-2.5a7 7 0 0 0 2.8-1.6l2.4.7 2-3.4-2-1.6c.13-.5.2-1 .2-1.6z" fill="none"/>',
    trash:'<path d="M4 7h16" /><path d="M9 7V4h6v3" fill="none"/><path d="M6 7l1 13h10l1-13" fill="none"/>',
    edit:'<path d="M4 20l1-4 12-12 3 3-12 12-4 1z" fill="none"/>',
    phone:'<path d="M6 3l3 1 .5 3-2 2c1 2.5 3 4.5 5.5 5.5l2-2 3 .5 1 3c0 1-1 2-2 2C10 18 4 12 3 5c0-1 1-2 2-2z" fill="none"/>',
    plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    left:'<polyline points="15 18 9 12 15 6" fill="none"/>',

/* ---------------------------------------------------------- */
/*  ذخیره‌سازی محلی (localStorage) — فقط به‌عنوان کش محلی مرورگر؛
      منبع اصلی و مشترک همیشه Firebase Realtime Database است.      */
/* ---------------------------------------------------------- */
var NS = "taxapp_v1::";
function lsGet(key){
  try{ var raw = window.localStorage.getItem(NS+key); return raw===null ? null : JSON.parse(raw); }
  catch(e){ return null; }
}
function lsSet(key, val){
  try{ window.localStorage.setItem(NS+key, JSON.stringify(val)); return true; }
  catch(e){ console.error("storage error", e); return false; }
}
function getOrSeed(key, seed){
  var v = lsGet(key);
  if(v !== null) return v;
  lsSet(key, seed);
  return seed;
}

var DB = { questions:[], obligations:[], penalties:[], templates:[], plans:[], meta:{}, leads:[], licenses:[], licenseLogs:[], users:{} };

function loadDB(){
  DB.questions   = getOrSeed('questions', SEED_QUESTIONS);
  DB.obligations = getOrSeed('obligations', SEED_OBLIGATIONS);
  DB.penalties   = getOrSeed('penalties', SEED_PENALTIES);
  DB.templates   = getOrSeed('templates', SEED_TEMPLATES);
  DB.plans       = getOrSeed('plans', SEED_PLANS);
  DB.meta        = Object.assign({}, SEED_META, getOrSeed('meta', SEED_META));
  DB.leads       = getOrSeed('leads', []);
  DB.licenses    = getOrSeed('licenses', []);
  DB.licenseLogs = getOrSeed('licenseLogs', []);
  DB.users       = getOrSeed('users', {});
}
function saveDB(key){ lsSet(key, DB[key]); fbWrite(key); }

/* ---------------------------------------------------------- */
/*  لایسنس‌ها — با مدت‌زمان انقضا (۱، ۶ یا ۱۲ ماهه) + یک لایسنس
      پیش‌فرض دائمی «۱۲۳» که مدیر می‌تواند فعال/غیرفعال کند.        */
/* ---------------------------------------------------------- */
function checkLicense(code){
  code = (code||'').trim();
  if(!code) return false;
  if(DB.meta.defaultLicenseEnabled !== false && code === (DB.meta.defaultLicenseCode || '123')) return true;
  var lic = DB.licenses.filter(function(l){ return l.code === code; })[0];
  if(!lic) return false;
  if(lic.expiresAt && new Date(lic.expiresAt).getTime() < Date.now()) return false;
  return true;
}
function isLicenseVerified(){
  var code = lsGet('license_ok');
  if(!code) return false;
  return checkLicense(code);
}
function setLicenseVerified(code){ lsSet('license_ok', code); }
function clearLicenseVerified(){ try{ window.localStorage.removeItem(NS+'license_ok'); }catch(e){} }

      "نام":lead.name,
      "شماره_تماس":lead.phone,
      "نوع_مودی":lead.personType || '-',
      "بسته_انتخابی":lead.planTitle || '-',
      "مجموع_جرایم_برآوردی":toman(lead.totalRaw),
      "توضیحات":lead.note || '-',
      "تاریخ_ثبت": new Date().toLocaleString('fa-IR')
    })
  }).then(function(res){
    if(!res.ok) return {ok:false, reason:'http-'+res.status};
    return {ok:true};
  }).catch(function(){
    return {ok:false, reason:'network'};
  });
}

/* ---------------------------------------------------------- */
/*  محاسبه جریمه                                                */
/* ---------------------------------------------------------- */
function calcAmount(p, input){
  if(!p) return 0;
  if(p.calcType === 'fixed') return p.value;
  if(p.calcType === 'percent') return (Number(input && input.base) || 0) * (p.value/100);
  if(p.calcType === 'permonth') return p.value * (Number(input && input.months) || 0);
  if(p.calcType === 'permonth_percent') return (Number(input && input.base) || 0) * (p.value/100) * (Number(input && input.months) || 0);
  return 0;
}
function calcTypeLabel(t){
  if(t==='fixed') return 'مبلغ ثابت';
  if(t==='percent') return 'درصدی از مالیات/مبلغ پایه';
  if(t==='permonth') return 'مبلغ ثابت به ازای هر ماه تأخیر';
  if(t==='permonth_percent') return 'درصدی از مبلغ پایه به ازای هر ماه تأخیر';
  return t;
}

   جریان کاربر: ویزارد شاخه‌ای
   ============================================================ */
function orderedQuestionsFor(personType){
  return DB.questions.filter(function(q){ return !q.appliesTo || q.appliesTo.indexOf(personType) !== -1; })
    .slice().sort(function(a,b){ return (a.order||0)-(b.order||0); });
}
function currentQuestion(){
  var qs = orderedQuestionsFor(S.wiz.personType);
  return qs.filter(function(q){ return q.id === S.wiz.qId; })[0] || null;
}
function nextQuestionAfter(qId){
  var qs = orderedQuestionsFor(S.wiz.personType);
  var idx = qs.findIndex(function(q){ return q.id === qId; });
  if(idx === -1 || idx+1 >= qs.length) return null;
  return qs[idx+1];
}
function derivedObligationIds(){
  var ids = {};
  Object.keys(S.wiz.answers).forEach(function(qId){
    var optId = S.wiz.answers[qId];
    var q = DB.questions.filter(function(x){return x.id===qId;})[0];
    var opt = q && q.options.filter(function(o){return o.id===optId;})[0];
    (opt && opt.obligationIds || []).forEach(function(id){ ids[id]=true; });
  });
  return ids;
}
function fixedObligations(){
  return DB.obligations.filter(function(o){ return o.fixed && (!o.appliesTo || o.appliesTo.indexOf(S.wiz.personType) !== -1); });
}
function derivedObligations(){
  var ids = derivedObligationIds();
  var fixedIds = {};
  fixedObligations().forEach(function(o){ fixedIds[o.id]=true; });
  return DB.obligations.filter(function(o){
    return (ids[o.id] || fixedIds[o.id]) && (!o.appliesTo || o.appliesTo.indexOf(S.wiz.personType) !== -1);
  });
}
function relatedPenaltyIds(){
  var ids = {};
  derivedObligations().forEach(function(o){ (o.penaltyIds||[]).forEach(function(id){ ids[id]=true; }); });
  return ids;
}
function selectedPenalties(){
  return DB.penalties.filter(function(p){ return S.wiz.selected[p.id] && S.wiz.selected[p.id].checked; });
}
function totalRawAmount(){
  return selectedPenalties().reduce(function(s,p){ return s + calcAmount(p, S.wiz.selected[p.id]); }, 0);
}
function totalAmnestyAmount(){
  return selectedPenalties().reduce(function(s,p){
    var amt = calcAmount(p, S.wiz.selected[p.id]);
    return s + (p.amnestyEligible ? amt*(1-p.amnestyPercent/100) : amt);
  }, 0);
}
function buildLayeha(){
  var tpl = DB.templates.filter(function(t){return t.id===S.wiz.templateId;})[0] || DB.templates[0];
  if(!tpl) return '';
  var list = selectedPenalties().map(function(p,i){
    return (i+1)+'. '+p.title+' ('+(p.legalArticle||'')+') — مبلغ: '+toman(calcAmount(p, S.wiz.selected[p.id]));
  }).join('\n');
  return tpl.body
    .split('{{taxpayerType}}').join(S.wiz.personType || '—')
    .split('{{penaltiesList}}').join(list || '—')
    .split('{{totalRaw}}').join(toman(totalRawAmount()))
    .split('{{totalAmnesty}}').join(toman(totalAmnestyAmount()))
    .split('{{date}}').join(new Date().toLocaleDateString('fa-IR'));
}

function handleAnswer(optId){
  var q = currentQuestion();
  if(!q) return;
  S.wiz.answers[q.id] = optId;
  var opt = q.options.filter(function(o){return o.id===optId;})[0];
  if(opt && opt.end){
    S.wiz.step = 'obligations';
    render();
    return;
  }
  var nq = nextQuestionAfter(q.id);
  if(nq){ S.wiz.qId = nq.id; }
  else { S.wiz.step = 'obligations'; }
  render();
}

function downloadBlob(content, filename, type){

  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

    S.wiz.licenseError = '';
    S.wiz.licenseFailCount = 0;
    S.wiz.step = 'penalties';
  } else {
    S.wiz.licenseFailCount = (S.wiz.licenseFailCount||0) + 1;
    if(S.wiz.licenseFailCount >= 5){
      S.wiz.licenseLockUntil = Date.now() + 20000;
      S.wiz.licenseError = 'تعداد تلاش‌های ناموفق زیاد بود. لطفاً ۲۰ ثانیه صبر کنید یا با پشتیبانی تماس بگیرید.';
      S.wiz.licenseFailCount = 0;
      scheduleLicenseUnlockTick();
    } else {
      S.wiz.licenseError = 'کد لایسنس نامعتبر یا منقضی‌شده است. لطفاً با پشتیبانی تماس بگیرید.';
    }
  }
  render();
}
function scheduleLicenseUnlockTick(){
  setTimeout(function(){
    if(S.wiz.step==='license'){ render(); }
    if(S.wiz.licenseLockUntil > Date.now()) scheduleLicenseUnlockTick();
  }, 1000);
}
function renderLicenseGateStep(){
  var now = Date.now();
  var locked = S.wiz.licenseLockUntil > now;
  var secLeft = locked ? Math.ceil((S.wiz.licenseLockUntil-now)/1000) : 0;
  return (
    '<div class="card narrow">' +
      '<div class="lock-wrap"><div class="lock-badge">'+ic('key',22,'#E7C878')+'</div>' +
        '<h2>ورود کد لایسنس</h2>' +

      '<label class="field"><span class="field-label">کد لایسنس</span>' +
        '<input type="text" id="licenseInputEl" value="'+esc(S.wiz.licenseInput)+'" oninput="S.wiz.licenseInput=this.value" '+(locked?'disabled':'')+' placeholder="کد لایسنس را وارد کنید" onkeydown="if(event.key===\'Enter\')submitLicense();" />' +
      '</label>' +
      (S.wiz.licenseError ? '<div class="field-error">'+esc(S.wiz.licenseError)+'</div>' : '') +
      '<div class="btn-row start">' +
        '<button class="btn btn-ghost" onclick="goStep(\'obligations\')">بازگشت</button>' +

var WIZ_STEPS = ["intro","questions","obligations","penalties","calc","layeha","consult"];
var WIZ_LABELS = ["سوالات","تکالیف شما","انتخاب جرایم","محاسبه","نمونه لایحه","مشاوره"];
function renderProgressTabs(){
  if(S.wiz.step === 'intro' || S.wiz.step === 'quota') return '';
  var effectiveStep = S.wiz.step === 'license' ? 'penalties' : S.wiz.step;
  var stepIndex = WIZ_STEPS.indexOf(effectiveStep);
  var html = '<div class="progress-tabs">';
  WIZ_LABELS.forEach(function(label, i){
    var idx = i+1;
    var active = stepIndex === idx;
    var done = stepIndex > idx;
    html += '<div class="progress-tab '+(active?'active':(done?'done':''))+'">'+(done?ic('check',12):'')+'<span>'+label+'</span></div>';
  });
  html += '</div>';
  return html;
}

function renderUserWizard(){
  /* اگر سهمیه رایگان تمام شده و لایسنس معتبر ندارد، حتی صفحه انتخاب
     نوع شخصیت هم نمایش داده نمی‌شود؛ باید ابتدا لایسنس وارد کند. */
  if(S.wiz.step === 'intro' && !hasQuotaOrLicense()){
    return renderProgressTabsSafeEmpty() + renderQuotaGate();
  }
  var step = S.wiz.step;
  var body = '';
  if(step === 'intro') body = renderStepIntro();
  else if(step === 'quota') body = renderQuotaGate();
  else if(step === 'questions') body = renderStepQuestions();
  else if(step === 'obligations') body = renderStepObligations();
  else if(step === 'license') body = renderLicenseGateStep();
  else if(step === 'penalties') body = renderStepPenalties();
  else if(step === 'calc') body = renderStepCalc();
  else if(step === 'layeha') body = renderStepLayeha();
  else if(step === 'consult') body = renderStepConsult();
  return renderProgressTabs() + body;
}
function renderProgressTabsSafeEmpty(){ return ''; }

var EMPTY_MAKERS = {
  question: function(){ return {id:genId('q'), order:(DB.questions.length+1), text:'', appliesTo:['حقیقی','حقوقی'], options:[{id:genId('opt'),label:'بله',obligationIds:[],end:false},{id:genId('opt'),label:'خیر',obligationIds:[],end:false}]}; },
  obligation: function(){ return {id:genId('o'), title:'', appliesTo:['حقیقی','حقوقی'], fixed:false, description:'', deadline:'', penaltyIds:[]}; },
  penalty: function(){ return {id:genId('p'), title:'', description:'', calcType:'fixed', value:0, amnestyEligible:false, amnestyPercent:0, installmentEligible:false, maxInstallments:1, legalArticle:''}; },
  template: function(){ return {id:genId('t'), title:'', body:''}; },
  plan: function(){ return {id:genId('pl'), title:'', price:0, duration:'', desc:''}; }
};
var COLL_KEY = {question:'questions', obligation:'obligations', penalty:'penalties', template:'templates', plan:'plans'};

function openAddForm(type){ S.formType=type; S.formMode='add'; S.formId=null; S.form=EMPTY_MAKERS[type](); render(); window.scrollTo(0,0); }
function openEditForm(type, id){
  var coll = DB[COLL_KEY[type]];
  var item = coll.filter(function(x){return x.id===id;})[0];
  if(!item) return;
  S.formType=type; S.formMode='edit'; S.formId=id; S.form=clone(item); render(); window.scrollTo(0,0);
}
function cancelForm(){ S.formType=null; S.formMode=null; S.formId=null; S.form={}; render(); }
function deleteItem(type, id){
  if(!confirm('آیا از حذف این مورد مطمئن هستید؟')) return;
  var key = COLL_KEY[type];
  DB[key] = DB[key].filter(function(x){return x.id!==id;});
  saveDB(key);
  render();
}
function saveForm(){
  var key = COLL_KEY[S.formType];
  if(S.formType==='question' && !S.form.text.trim()){ alert('متن سوال را وارد کنید.'); return; }
  if((S.formType==='obligation'||S.formType==='penalty'||S.formType==='template'||S.formType==='plan') && !S.form.title.trim()){ alert('عنوان را وارد کنید.'); return; }
  if(S.formType==='plan'){ S.form.price = Number(S.form.price)||0; }
  if(S.formType==='question'){ S.form.order = Number(S.form.order)||1; }
  if(S.formType==='penalty'){ S.form.value = Number(S.form.value)||0; S.form.amnestyPercent = Number(S.form.amnestyPercent)||0; S.form.maxInstallments = Number(S.form.maxInstallments)||1; }
  if(S.formMode==='add'){ DB[key].push(S.form); }
  else { DB[key] = DB[key].map(function(x){ return x.id===S.formId ? S.form : x; }); }
  saveDB(key);
  cancelForm();
}
function toggleAppliesTo(kind){
  var arr = S.form.appliesTo || [];
  var idx = arr.indexOf(kind);
  if(idx===-1) arr = arr.concat([kind]); else arr = arr.filter(function(x){return x!==kind;});
  S.form.appliesTo = arr; render();
}
function toggleObligationFixed(checked){ S.form.fixed = checked; render(); }
function toggleMultiId(field, id){
  var arr = S.form[field] || [];
  var idx = arr.indexOf(id);
  if(idx===-1) arr = arr.concat([id]); else arr = arr.filter(function(x){return x!==id;});
  S.form[field] = arr; render();
}
function renderMultiCheck(allItems, selectedIds, field){
  return '<div class="multi-check">' + allItems.map(function(item){
    var checked = (selectedIds||[]).indexOf(item.id) !== -1;
    return '<label class="checkbox-row"><input type="checkbox" '+(checked?'checked':'')+' onchange="toggleMultiId(\''+field+'\',\''+item.id+'\')" /><span>'+esc(item.title||item.text)+'</span></label>';
  }).join('') + '</div>';
}

function updateLeadStatus(id, status){
  DB.leads = DB.leads.map(function(l){ return l.id===id ? Object.assign({}, l, {status:status}) : l; });
  saveDB('leads');
}
function deleteLead(id){
  if(!confirm('آیا از حذف این درخواست مطمئن هستید؟')) return;
  DB.leads = DB.leads.filter(function(l){return l.id!==id;});
  saveDB('leads');
  render();
}
function onLeadsQueryInput(v){ S.leadsQuery = v; render(); }
function csvEscape(v){
  v = String(v===null||v===undefined?'':v);
  if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function exportLeadsCSV(){
  var header = ['نام','شماره تماس','نوع مؤدی','بسته انتخابی','مجموع جرایم','وضعیت','توضیحات','تاریخ ثبت'];
  var rows = DB.leads.map(function(l){
    return [l.name, l.phone, l.personType||'', l.planTitle||'', l.totalRaw||0, l.status||'جدید', (l.note||'').replace(/\n/g,' '), l.createdAt];
  });
  var csv = [header].concat(rows).map(function(r){ return r.map(csvEscape).join(','); }).join('\r\n');
  downloadBlob('\uFEFF'+csv, 'leads.csv', 'text/csv;charset=utf-8');
}
function renderLeadsAdmin(){
  var q = (S.leadsQuery||'').trim();
  var filtered = DB.leads.filter(function(l){
    return !q || (l.name&&l.name.indexOf(q)!==-1) || (l.phone&&l.phone.indexOf(q)!==-1) || (l.note&&l.note.indexOf(q)!==-1);
  });
  var list = filtered.slice().reverse().map(function(l){
    var statusOptions = LEAD_STATUSES.map(function(s){ return '<option value="'+s+'" '+((l.status||'جدید')===s?'selected':'')+'>'+s+'</option>'; }).join('');
    var extra = '<div style="margin-top:8px;max-width:220px;"><select onchange="updateLeadStatus(\''+l.id+'\', this.value)">'+statusOptions+'</select></div>';
    var sub = 'نوع مؤدی: '+esc(l.personType||'—')+' — بسته: '+esc(l.planTitle||'—')+' — مجموع جرایم: '+toman(l.totalRaw)+(l.note?(' — '+esc(l.note)):'');
    return adminRow(l.name+' — '+l.phone, sub, null, "deleteLead('"+l.id+"')", extra);
  }).join('');
  return (
    '<div class="card">' +
      '<div class="section-title-row"><div class="section-title tight"><h2>درخواست‌های تماس ثبت‌شده</h2></div>' +
        '<button class="btn btn-ghost btn-sm" '+(DB.leads.length===0?'disabled':'')+' onclick="exportLeadsCSV()">'+ic('download',13)+'<span>خروجی CSV</span></button>' +
      '</div>' +
      '<div class="search-wrap" style="margin-bottom:16px;">' +
        '<span class="search-icon">'+ic('search',15)+'</span>' +
        '<input type="text" value="'+esc(S.leadsQuery)+'" oninput="onLeadsQueryInput(this.value)" placeholder="جستجو بر اساس نام یا شماره تماس" /></div>' +
      '<div class="stack">'+(filtered.length===0 ? '<p class="muted">هنوز درخواستی ثبت نشده است.</p>' : list)+'</div>' +
    '</div>'
  );
}

function genLicenseCode(){
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var s = '';
  for(var i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function fillGeneratedLicenseCode(){
  var el = document.getElementById('newLicenseCodeInput');
  if(el) el.value = genLicenseCode();
}
function setNewLicenseDuration(m){ S.newLicenseDuration = Number(m); render(); }
function addLicense(){
  var codeEl = document.getElementById('newLicenseCodeInput');
  var noteEl = document.getElementById('newLicenseNoteInput');
  var code = codeEl ? codeEl.value.trim() : '';
  var note = noteEl ? noteEl.value.trim() : '';
  var months = S.newLicenseDuration || 1;
  if(!code){ alert('کد لایسنس را وارد یا تولید کنید.'); return; }
  if(DB.licenses.some(function(l){return l.code===code;})){ alert('این کد قبلاً ثبت شده است.'); return; }
  var createdAt = new Date().toISOString();
  DB.licenses.push({code:code, note:note, durationMonths:months, createdAt:createdAt, expiresAt: addMonthsIso(createdAt, months)});
  saveDB('licenses');
  render();
}
function deleteLicense(code){
  if(!confirm('این کد لایسنس حذف شود؟')) return;

}

function boot(){
  loadDB();
  checkAdminHash();
  if(!S.wiz.lead.planId && DB.plans[0]) S.wiz.lead.planId = DB.plans[0].id;
  if(!S.wiz.templateId && DB.templates[0]) S.wiz.templateId = DB.templates[0].id;
  restoreAuthSession();
  render();
  fbBoot();
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
