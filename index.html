// ============================================================
var Api = {
  async _fetch(path, opts){
    opts = opts || {};
    var headers = Object.assign({ 'Content-Type':'application/json' }, opts.headers || {});
    var res = await fetch(API_BASE + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    var data = null;
    try { data = await res.json(); } catch(e) { data = null; }
    if (!res.ok) { var err = new Error((data && data.error) || ('HTTP '+res.status)); err.status = res.status; err.data = data; throw err; }
    return data;
  },
  getData(){ return this._fetch('/api/data'); },
  register(name, phone, ref){ return this._fetch('/api/register', { method:'POST', body:{name:name, phone:phone, ref:ref||''} }); },
  usage(phone){ return this._fetch('/api/usage', { method:'POST', body:{phone:phone} }); },
  verifyLicense(code, phone){ return this._fetch('/api/license/verify', { method:'POST', body:{code:code, phone:phone||''} }); },
  submitLead(lead){ return this._fetch('/api/leads', { method:'POST', body:lead }); },
  adminLogin(password){ return this._fetch('/api/admin/login', { method:'POST', body:{password:password} }); },
  adminGetData(token){ return this._fetch('/api/admin/data', { headers:{ 'Authorization':'Bearer '+token } }); },
  adminPutData(token, data){ return this._fetch('/api/admin/data', { method:'PUT', headers:{ 'Authorization':'Bearer '+token }, body:data }); },
  kbSearch(query, phone, licensed){ return this._fetch('/api/kb/search', { method:'POST', body:{query:query, phone:phone, licensed:licensed} }); },
  kbAnswer(query, phone, licensed){ return this._fetch('/api/kb/answer', { method:'POST', body:{query:query, phone:phone, licensed:licensed} }); },
  licenseRequest(payload){ return this._fetch('/api/license-request', { method:'POST', body:payload }); },
  upload(filename, mimeType, dataBase64){ return this._fetch('/api/upload', { method:'POST', body:{filename:filename, mimeType:mimeType, dataBase64:dataBase64} }); },
  serviceRequest(payload){ return this._fetch('/api/service-request', { method:'POST', body:payload }); },
  auditToggle(phone, itemId, checked){ return this._fetch('/api/audit/toggle', { method:'POST', body:{phone:phone, itemId:itemId, checked:checked} }); },
  saveObligations(phone, personType, obligationIds){ return this._fetch('/api/obligations/save', { method:'POST', body:{phone:phone, personType:personType, obligationIds:obligationIds} }); },
  adminGetFile(token, fileId){ return this._fetch('/api/admin/file?id='+encodeURIComponent(fileId), { headers:{ 'Authorization':'Bearer '+token } }); },
  adminFetchLink(token, url){ return this._fetch('/api/admin/fetch-link', { method:'POST', headers:{ 'Authorization':'Bearer '+token }, body:{url:url} }); },
  me(phone){ return this._fetch('/api/me', { method:'POST', body:{phone:phone} }); },
  adminBackups(token){ return this._fetch('/api/admin/backups', { headers:{ 'Authorization':'Bearer '+token } }); },
  adminBackupGet(token, key){ return this._fetch('/api/admin/backup?key='+encodeURIComponent(key), { headers:{ 'Authorization':'Bearer '+token } }); },
  adminRestore(token, key){ return this._fetch('/api/admin/restore', { method:'POST', headers:{ 'Authorization':'Bearer '+token }, body:{key:key} }); }
};

// ============================================================
// روتینگ مبتنی بر Hash
// ============================================================
function hashParts(){
  var h = (window.location.hash || '').replace(/^#\/?/, '');
  return h ? h.split('/').filter(Boolean) : [];
}
function go(path){
  var target = '#/' + path;
  if (window.location.hash === target) { onRoute(); render(); }
  else { window.location.hash = target; }
  window.scrollTo(0,0);
}
function onRoute(){
  var parts = hashParts();
  if (parts[0] === 'admin') {
    S.route = 'admin';
    S.adminTab = parts[1] || S.adminTab || 'dashboard';
  } else if (parts[0] === 'wizard') {
    S.route = 'user';
    S.wiz.step = parts[1] || 'intro';
    S.wiz.serviceView = (parts[1]==='services') ? (parts[2] || null) : null;
  } else {
    S.route = 'user';
    if (!S.wiz.step) S.wiz.step = 'intro';
  }
}
window.addEventListener('hashchange', function(){ onRoute(); render(); });

function esc(s){ return String(s===null||s===undefined?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function addMonthsIso(d, m){ var dt=new Date(d); dt.setMonth(dt.getMonth()+Number(m||0)); return dt.toISOString(); }

function calcAmount(p, input){
  if(!p) return 0;
  if(p.calcType==='fixed') return p.value;
  if(p.calcType==='percent') return (Number(input&&input.base)||0)*(p.value/100);
  if(p.calcType==='permonth') return p.value*(Number(input&&input.months)||0);
  if(p.calcType==='permonth_percent') return (Number(input&&input.base)||0)*(p.value/100)*(Number(input&&input.months)||0);
  return 0;
}
function calcTypeLabel(t){
  if(t==='fixed') return 'مبلغ ثابت';
  if(t==='percent') return 'درصدی';
  if(t==='permonth') return 'مبلغ ثابت هر ماه';
  if(t==='permonth_percent') return 'درصدی هر ماه';
  return t;
}

    license:'فعال‌سازی اشتراک', penalties:'جرایم مالیاتی', calc:'جمع‌بندی جرایم', layeha:'نمونه لایحه اعتراض',

  document.title = t ? (t + ' | ' + base) : (base + ' | تکالیف، مواعد، جرایم و بخشودگی مالیاتی');

// بنر اخبار مالیاتی مهم — فقط مهم‌ترین خبر فعال را برجسته نشان می‌دهد؛ بقیه پشت یک لینک «بیشتر» مخفی‌اند
function renderNewsBanner(){
  var list = (CATALOG.news||[]).filter(function(n){ return lsGet('news_dismissed_'+n.id)!=='1'; });
  if (!list.length) return '';
  var top = list[0];
  var rest = list.slice(1);
  var cls = top.level==='urgent' ? 'urgent' : 'info';
  var html = '<div class="news-banner '+cls+'">' +
    ic('alert',18) +
    '<div style="flex:1;min-width:0;"><div class="news-title">'+esc(top.title)+'</div>' +
    '<div class="news-body">'+esc(top.body)+'</div>' +
    (rest.length ? '<button class="news-more" onclick="S.showMoreNews=!S.showMoreNews; render();">'+(S.showMoreNews?'بستن فهرست':('مشاهدهٔ '+toFa(rest.length)+' خبر دیگر'))+'</button>' : '') +
    '</div>' +
    '<button class="news-close" title="بستن" onclick="dismissNews(\''+top.id+'\')">'+ic('x',14)+'</button>' +
  '</div>';
  if (S.showMoreNews && rest.length) {
    html += '<div class="news-more-list">' + rest.map(function(n){
      return '<div class="item"><b>'+esc(n.title)+'</b><div class="small-muted" style="margin-top:2px;">'+esc(n.body)+'</div></div>';
    }).join('') + '</div>';
  }
  return html;
}
function dismissNews(id){ lsSet('news_dismissed_'+id, '1'); render(); }

}

async function submitAuth(){
  var nameEl=document.getElementById('authNameInput'), phoneEl=document.getElementById('authPhoneInput');
  var name=nameEl?nameEl.value.trim():'', phone=phoneEl?phoneEl.value.trim():'';
  if(!S.authTermsAccepted){ S.authError='برای ادامه باید شرایط و قوانین را بپذیرید.'; render(); return; }
  if(!name){ S.authError='نام را وارد کنید.'; render(); return; }
  if(!IRAN_MOBILE_RE.test(phone)){ S.authError='شماره موبایل معتبر نیست.'; render(); return; }
  S.authLoading = true; S.authError=''; render();
  try{
    var res = await Api.register(name, phone, lsGet('pending_ref')||'');
    apiStatus = 'online';
    var key = phone.replace(/^0/,'');
    S.authPhone = key; S.authName = name; S.remaining = res.remaining; S.myRefCode = res.refCode || '';
    lsSet('auth_phone', key); lsSet('auth_name', name); lsDel('pending_ref');
    S.authLoading = false;
    go('');
  }catch(e){
    apiStatus='offline';
    S.authLoading = false;
    S.authError = 'اتصال به سرور برقرار نشد. لطفاً دوباره تلاش کنید.';
    render();
  }
}

function currentQuestion(){ return CATALOG.questions.find(function(q){ return q.id===S.wiz.qId; }) || null; }
function fixedObligations(){ return CATALOG.obligations.filter(function(o){ return o.fixed && (!o.appliesTo || o.appliesTo.indexOf(S.wiz.personType)!==-1); }); }
function derivedObligations(){
  var fx={}; fixedObligations().forEach(function(o){ fx[o.id]=true; });
  return CATALOG.obligations.filter(function(o){ return (fx[o.id]||S.wiz.triggered[o.id]) && (!o.appliesTo || o.appliesTo.indexOf(S.wiz.personType)!==-1); });
}
function relatedPenalties(){
  var ids={};
  derivedObligations().forEach(function(o){ (o.penaltyIds||[]).forEach(function(id){ ids[id]=true; }); });
  return CATALOG.penalties.filter(function(p){ return ids[p.id]; });
}
function selectedPenalties(){ return relatedPenalties().filter(function(p){ return S.wiz.selected[p.id] && S.wiz.selected[p.id].checked; }); }
function totalRawAmount(){ return selectedPenalties().reduce(function(s,p){ return s+calcAmount(p,S.wiz.selected[p.id]); },0); }
function totalAmnestyAmount(){ return selectedPenalties().reduce(function(s,p){ var amt=calcAmount(p,S.wiz.selected[p.id]); return s+(p.amnestyEligible?amt*(1-p.amnestyPercent/100):amt); },0); }
function buildLayeha(){
  var tpl=CATALOG.templates.find(function(t){return t.id===S.wiz.templateId;})||CATALOG.templates[0];
  if(!tpl) return '';
  var list=selectedPenalties().map(function(p,i){ return (i+1)+'. '+p.title+' ('+(p.legalArticle||'')+') — '+toman(calcAmount(p,S.wiz.selected[p.id])); }).join('\n');
  return tpl.body.split('{{taxpayerType}}').join(S.wiz.personType||'—')
    .split('{{penaltiesList}}').join(list||'—')
    .split('{{totalRaw}}').join(toman(totalRawAmount()))
    .split('{{totalAmnesty}}').join(toman(totalAmnestyAmount()))
    .split('{{date}}').join(new Date().toLocaleDateString('fa-IR'));
}

function isLicenseVerified(){ return !!lsGet('license_ok'); }
// آیا کد فعال‌شدهٔ فعلی، دسترسی به این خدمت مشخص را هم پوشش می‌دهد؟
// کدهای قدیمی‌تر که بدون scope ذخیره شده‌اند (قبل از این قابلیت)، مثل قبل دسترسی کامل دارند.
function hasScopeAccess(key){
  if (!isLicenseVerified()) return false;
  var scope = lsGet('license_scope');
  if (!scope || !scope.length) return true;
  return scope.indexOf('all')!==-1 || scope.indexOf(key)!==-1;
}
function hasQuotaOrLicense(){ return (S.remaining===null || S.remaining>0) || hasScopeAccess('wizard'); }

async function startWizard(type){
  // همیشه اجازهٔ شروع و مشاهدهٔ تکالیف داده می‌شود؛ سهمیهٔ رایگان فقط تعیین می‌کند که آیا
  // ادامهٔ مسیر (جرایم و بخشودگی) در همین اجرا بدون لایسنس هم آزاد است یا خیر.
  var hadQuotaBeforeThisRun = hasQuotaOrLicense();
  S.wiz.fullAccessGranted = hasScopeAccess('wizard') || hadQuotaBeforeThisRun;
  if (!hasScopeAccess('wizard') && hadQuotaBeforeThisRun) {
    try { var r = await Api.usage(S.authPhone); S.remaining = r.remaining; apiStatus='online'; }
    catch(e){ apiStatus='offline'; }
  }
  S.wiz.personType = type;
  S.wiz.answers = {}; S.wiz.triggered = {};
  var root = (CATALOG.meta.rootQuestion || {})[type];
  S.wiz.qId = root || null;
  if (root) go('wizard/questions'); else go('wizard/obligations');
}

function handleAnswer(optId){
  var q = currentQuestion(); if(!q) return;
  var opt = q.options.find(function(o){ return o.id===optId; });
  if (!opt) return;
  S.wiz.answers[q.id] = optId;
  (opt.obligationIds||[]).forEach(function(id){ S.wiz.triggered[id]=true; });
  if (opt.nextId) { S.wiz.qId = opt.nextId; render(); }
  else { go('wizard/obligations'); }
}

function goStep(step){
  if (step==='penalties' && !S.wiz.fullAccessGranted && !hasScopeAccess('wizard')) { go('wizard/license'); return; }
  go('wizard/'+step);
}
function togglePenalty(id, checked){ S.wiz.selected[id]=Object.assign({}, S.wiz.selected[id]||{}, {checked:checked}); render(); }
function setPenaltyInput(id, field, value){ S.wiz.selected[id]=Object.assign({}, S.wiz.selected[id]||{}); S.wiz.selected[id][field]=value; }
function onEnterLayeha(){ if(!S.wiz.templateId) S.wiz.templateId=(CATALOG.templates[0]&&CATALOG.templates[0].id)||null; S.wiz.layehaText=buildLayeha(); goStep('layeha'); }
function onTemplateChange(v){ S.wiz.templateId=v; S.wiz.layehaText=buildLayeha(); render(); }
function onLayehaTextChange(v){ S.wiz.layehaText=v; }
function copyLayehaText(){
  var ta=document.getElementById('layehaTextArea'); var text=ta?ta.value:S.wiz.layehaText;
  var done=function(){ S.wiz.copyMsg='✅ کپی شد'; render(); setTimeout(function(){ S.wiz.copyMsg=''; render(); },1800); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(function(){ S.wiz.copyMsg='کپی خودکار پشتیبانی نشد.'; render(); }); }
  else { S.wiz.copyMsg='کپی خودکار پشتیبانی نشد.'; render(); }
}
function downloadLayehaText(){
  var ta=document.getElementById('layehaTextArea'); var text=ta?ta.value:S.wiz.layehaText;
  var blob=new Blob([text],{type:'text/plain;charset=utf-8'}); var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download='layeha.txt'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function selectPlan(id){ S.wiz.lead.planId=id; render(); }

async function submitLead(){
  var nameEl=document.getElementById('leadNameInput'), phoneEl=document.getElementById('leadPhoneInput'), noteEl=document.getElementById('leadNoteInput');
  S.wiz.lead.name=nameEl?nameEl.value:S.wiz.lead.name;
  S.wiz.lead.phone=phoneEl?phoneEl.value:S.wiz.lead.phone;
  S.wiz.lead.note=noteEl?noteEl.value:S.wiz.lead.note;
  if(!S.wiz.lead.name || !IRAN_MOBILE_RE.test((S.wiz.lead.phone||'').trim())){ render(); return; }
  var plan=CATALOG.plans.find(function(p){return p.id===S.wiz.lead.planId;});
  var payload = {
    name:S.wiz.lead.name, phone:S.wiz.lead.phone, note:S.wiz.lead.note,
    planId:S.wiz.lead.planId, planTitle:plan?plan.title:'',
    personType:S.wiz.personType, totalRaw:totalRawAmount()
  };
  S.wiz.sendStatus='sending'; S.wiz.leadSyncFailed=false; render();
  try{
    await Api.submitLead(payload);
    apiStatus='online';
    S.wiz.leadSent=true; S.wiz.sendStatus='sent';
  }catch(e){
    apiStatus='offline';
    S.wiz.leadSent=false; S.wiz.sendStatus='error'; S.wiz.leadSyncFailed=true;
  }
  render();
}

function restartWizard(){
  S.wiz={step:'intro', personType:null, qId:null, answers:{}, triggered:{}, selected:{}, templateId:null, layehaText:'',
    lead:{name:'', phone:'', note:'', planId:(CATALOG.plans[0]&&CATALOG.plans[0].id)||null},
    leadSent:false, sendStatus:'idle', leadSyncFailed:false,
    licenseInput:'', licenseError:'', licenseChecking:false, copyMsg:'',
    fullAccessGranted:false, licenseReqSent:false, licenseReqSending:false,
    serviceView:null, kbQuery:'', kbResults:null, kbSearching:false, kbAnswer:null, kbRemaining:null, kbRequireLicense:false,
    myAuditChecked:{}, myReminders:[], myDataLoaded:false, reminderActivating:false, reminderMsg:'',
    svcForm:{name:'', phone:'', note:'', caseNumber:'', file:null, fileId:null, fileName:'', uploading:false, uploadError:''},
    svcSendStatus:'idle', svcSelectedPlanId:null};
  go('');
}

async function submitQuotaLicense(){
  var el=document.getElementById('quotaLicenseInput'); var code=el?el.value.trim():'';
  S.wiz.licenseChecking=true; render();
  try{
    var r = await Api.verifyLicense(code, S.authPhone); apiStatus='online';
    if (r.valid) { lsSet('license_ok', code); lsSet('license_scope', r.scope||['all']); S.wiz.licenseError=''; S.wiz.licenseChecking=false; go(''); }
    else { S.wiz.licenseError = r.reason==='used_by_other' ? 'این کد قبلاً توسط شمارهٔ دیگری فعال شده و قابل استفادهٔ مجدد نیست.' : 'کد نامعتبر است.'; S.wiz.licenseChecking=false; render(); }
  }catch(e){ apiStatus='offline'; S.wiz.licenseChecking=false; S.wiz.licenseError='خطا در برقراری ارتباط با سرور.'; render(); }
}
async function submitLicense(){
  var el=document.getElementById('licenseInputEl'); var code=el?el.value.trim():'';
  S.wiz.licenseChecking=true; render();
  try{
    var r = await Api.verifyLicense(code, S.authPhone); apiStatus='online';
    if (r.valid) { lsSet('license_ok', code); lsSet('license_scope', r.scope||['all']); S.wiz.licenseError=''; S.wiz.licenseChecking=false; go('wizard/penalties'); }
    else { S.wiz.licenseError = r.reason==='used_by_other' ? 'این کد قبلاً توسط شمارهٔ دیگری فعال شده و قابل استفادهٔ مجدد نیست.' : 'کد نامعتبر است.'; S.wiz.licenseChecking=false; render(); }
  }catch(e){ apiStatus='offline'; S.wiz.licenseChecking=false; S.wiz.licenseError='خطا در برقراری ارتباط با سرور.'; render(); }
}

// ============================================================
// رندر گام‌های ویزارد
// ============================================================
var WIZ_STEPS=["intro","questions","obligations","penalties","calc","layeha","consult"];
var WIZ_LABELS=["سوالات","تکالیف شما","انتخاب جرایم","محاسبه","نمونه لایحه","مشاوره"];
function renderProgressTabs(){
  if(S.wiz.step==='intro'||S.wiz.step==='quota') return '';
  var effectiveStep=S.wiz.step==='license'?'penalties':S.wiz.step;
  var stepIndex=WIZ_STEPS.indexOf(effectiveStep);
  var html='<div class="progress-tabs">';
  WIZ_LABELS.forEach(function(label,i){ var idx=i+1; var active=stepIndex===idx; var done=stepIndex>idx; html+='<div class="progress-tab '+(active?'active':(done?'done':''))+'">'+(done?ic('check',12):'')+'<span>'+label+'</span></div>'; });
  html+='</div>'; return html;
}

function renderUserWizard(){
  var step=S.wiz.step, body='';
  if(step==='intro') body=renderStepIntro();
  else if(step==='quota') body=renderQuotaGate();
  else if(step==='questions') body=renderStepQuestions();
  else if(step==='obligations') body=renderStepObligations();
  else if(step==='license') body=renderLicenseGateStep();
  else if(step==='penalties') body=renderStepPenalties();
  else if(step==='calc') body=renderStepCalc();
  else if(step==='layeha') body=renderStepLayeha();
  else if(step==='consult') body=renderStepConsult();
  else if(step==='services') return renderServicesArea();
  else body=renderStepIntro();
  return renderProgressTabs()+body;
}

function renderStepIntro(){
  var remain = S.remaining;
  var quotaLine = isLicenseVerified() ? '<span class="quota-pill">'+ic('shield',12)+' اشتراک فعال</span>'
    : '<span class="quota-pill">'+ic('info',12)+' '+(remain===null?'—':toFa(remain))+' اجرای کامل رایگان باقی‌مانده</span>';
  var servicesBtn = '<button class="btn btn-services btn-sm" onclick="go(\'wizard/services\')">'+ic('branch',13)+' <span>خدمات آنلاین</span></button>';
  return '<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;">'+quotaLine +
    '<div style="display:flex;gap:6px;flex-wrap:wrap;">'+servicesBtn+(S.authName?'<button class="btn btn-ghost btn-sm" onclick="logoutUser()">'+ic('logout',13)+' خروج ('+esc(S.authName)+')</button>':'')+'</div></div>' +
    '<div class="section-eyebrow">گام اول</div><div class="section-title"><h1>نوع مؤدی خود را انتخاب کنید</h1></div>' +
    '<p class="muted" style="margin-bottom:20px;">بر اساس نوع شخصیت، سوالات و تکالیف متفاوتی نمایش داده می‌شود — فقط سوالاتی که به وضعیت شما مربوط است پرسیده می‌شود.</p>' +
    '<div class="grid2">' +
      '<button class="choice-card" onclick="startWizard(\'حقیقی\')">'+ic('users',26,'#B8862E')+'<div class="title">شخص حقیقی</div><div class="desc">صاحبان مشاغل، فریلنسرها</div></button>' +
      '<button class="choice-card" onclick="startWizard(\'حقوقی\')">'+ic('shield',26,'#B8862E')+'<div class="title">شخص حقوقی</div><div class="desc">شرکت‌ها و مؤسسات</div></button>' +
    '</div></div>' + renderReferralCard();
}

// کارت دعوت از دوستان — فقط برای کاربران واردشده نمایش داده می‌شود
function renderReferralCard(){
  if (!S.authPhone) return '';
  if (!S.myRefCode && !S.myRefCodeLoading) { loadMyRefCode(); }
  if (!S.myRefCode) return '';
  return '<div class="offer-card" style="border-inline-start-color:var(--green);">' +
    '<div class="offer-icon">'+ic('users',18,'var(--green)')+'</div>' +
    '<div class="offer-body"><div class="offer-title">دوستان‌تان را دعوت کنید</div>' +
    '<div class="offer-sub">با هر ثبت‌نام از طریق لینک شما، هر دو یک استعلام رایگان اضافه می‌گیرید. کد شما: <b>'+esc(S.myRefCode)+'</b></div></div>' +
    '<button class="btn btn-ghost btn-sm" onclick="copyReferralLink()">'+ic('copy',13)+'<span>'+(S.refCopyMsg||'کپی لینک')+'</span></button>' +
  '</div>';
}
async function loadMyRefCode(){
  S.myRefCodeLoading = true;
  try{ var r = await Api.me(S.authPhone); if (r.refCode) S.myRefCode = r.refCode; apiStatus='online'; }catch(e){ apiStatus='offline'; }
  S.myRefCodeLoading = false; render();
}
function copyReferralLink(){
  var link = window.location.origin + window.location.pathname + '?ref=' + S.myRefCode;
  function done(){ S.refCopyMsg='کپی شد!'; render(); setTimeout(function(){ S.refCopyMsg=''; render(); }, 1800); }
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(link).then(done).catch(function(){ prompt('لینک دعوت شما:', link); }); }
  else { prompt('لینک دعوت شما:', link); }
}

// دکمه/پیام مشترک «تماس برای دریافت کد فعال‌سازی» — هم شمارهٔ مدیر را نشان می‌دهد هم پیام به او ارسال می‌کند
function renderLicenseHelper(context){
  var meta = CATALOG.meta||{};
  var phoneLine = meta.phone ? '<div class="small-muted" style="margin-top:6px;">برای دریافت کد فعال‌سازی می‌توانید مستقیم با شمارهٔ <b>'+esc(meta.phone)+'</b> تماس بگیرید.</div>' : '';
  if (S.wiz.licenseReqSent) {
    return phoneLine + '<div class="small-muted" style="margin-top:8px;color:var(--green);">✅ درخواست شما برای کارشناسان ما ارسال شد؛ به‌زودی با شما تماس می‌گیریم.</div>';
  }
  return phoneLine + '<button class="btn btn-ghost btn-sm" style="margin-top:10px;" '+(S.wiz.licenseReqSending?'disabled':'')+' onclick="requestLicenseCall(\''+context+'\')">'+ic('phone',13)+'<span>'+(S.wiz.licenseReqSending?'در حال ارسال...':'درخواست تماس برای دریافت کد فعال‌سازی')+'</span></button>';
}
async function requestLicenseCall(context){
  S.wiz.licenseReqSending = true; render();
  try{
    await Api.licenseRequest({ name:S.authName, phone:S.authPhone, context:context });
    apiStatus='online'; S.wiz.licenseReqSent = true;
  }catch(e){ apiStatus='offline'; alert('ارسال درخواست ناموفق بود. لطفاً دوباره تلاش کنید یا مستقیم تماس بگیرید.'); }
  S.wiz.licenseReqSending = false; render();
}

// فرم مشترک «فعال‌سازی اشتراک» — همان یک المان بصری در هر سه نقطهٔ ورود کد استفاده می‌شود
// تا کاربر همیشه یک مفهوم و یک ظاهر یکسان از «فعال‌سازی» ببیند، نه چند فرم پراکنده با نام‌های مختلف.
function renderActivationBody(opts){
  return '<div class="lock-wrap"><div class="lock-badge">'+ic(opts.icon||'key',22,'#E7C878')+'</div><h2>'+esc(opts.title)+'</h2>' +
    '<p>'+esc(opts.desc)+'</p></div>' +
    '<label class="field"><span class="field-label">کد فعال‌سازی اشتراک</span><input type="text" id="'+opts.inputId+'" value="'+esc(opts.value||'')+'" placeholder="مثال: A1B2C3" '+(opts.oninput?('oninput="'+opts.oninput+'" '):'')+'onkeydown="if(event.key===\'Enter\')'+opts.submitFn+'();" /></label>' +
    (S.wiz.licenseError?'<div class="field-error">'+esc(S.wiz.licenseError)+'</div>':'') +
    '<div class="btn-row start">'+(opts.backBtn||'')+'<button class="btn btn-gold" onclick="'+opts.submitFn+'()" '+(S.wiz.licenseChecking?'disabled':'')+'>'+ic('key',15)+'<span>'+(S.wiz.licenseChecking?'در حال بررسی...':'فعال‌سازی')+'</span></button></div>' +
    renderLicenseHelper(opts.context);
}

    inputId:'quotaLicenseInput', submitFn:'submitQuotaLicense', context:'quota'
  })+'</div>';
}

function renderLicenseGateStep(){
  var backBtn = '<button class="btn btn-ghost" onclick="goStep(\'obligations\')">بازگشت</button>';
  return '<div class="card narrow">'+renderActivationBody({
    icon:'key', title:'فعال‌سازی اشتراک مالیار',
    desc:'سهمیهٔ اجرای رایگان شما تمام شده؛ برای مشاهدهٔ جرایم و بخشودگی‌ها اشتراک خود را فعال کنید.',

function renderStepQuestions(){
  var q=currentQuestion(); if(!q) return renderStepObligations();
  var optsHtml=q.options.map(function(opt){ return '<button class="option-btn" onclick="handleAnswer(\''+opt.id+'\')">'+esc(opt.label)+'</button>'; }).join('');
  var answeredCount = Object.keys(S.wiz.answers).length;
  return '<div class="card"><div class="section-eyebrow">سوال '+toFa(answeredCount+1)+'</div><h2 style="font-size:16px;font-weight:800;margin:6px 0 18px;">'+esc(q.text)+'</h2>'+optsHtml+'</div>';
}

function renderStepObligations(){
  var obls=derivedObligations();
  var body = obls.length===0
    ? '<p class="muted">با توجه به پاسخ‌های شما، تکلیف فوری خاصی شناسایی نشد.</p>'
    : '<div class="stack">'+obls.map(function(o){
        var penTitles=(o.penaltyIds||[]).map(function(pid){ var p=CATALOG.penalties.find(function(x){return x.id===pid;}); return p?(p.title+' ('+(p.legalArticle||'')+')'):null; }).filter(Boolean).join('، ');
        return '<div class="block"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:6px;"><div class="row-title" style="font-weight:800;font-size:13.5px;">'+esc(o.title)+'</div>'+(o.fixed?'<span class="badge badge-ink">ثابت</span>':'')+'</div>' +
          '<div class="small-muted" style="margin-top:4px;line-height:1.8;">'+esc(o.description)+'</div>' +
          '<div style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;font-weight:700;color:var(--gold);">'+ic('calendar',13,'var(--gold)')+'<span>موعد: '+esc(o.deadline)+'</span></div>' +
          (penTitles?'<div style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--red);">'+ic('alert',13,'var(--red)')+'<span>جریمه: '+esc(penTitles)+'</span></div>':'') +
        '</div>';
      }).join('')+'</div>';
  return '<div class="card"><div class="section-eyebrow">گام دوم</div><div class="section-title"><h2>تکالیف مالیاتی شما</h2></div>'+body +
    '<div class="btn-row"><button class="btn btn-ghost" onclick="goStep(\'intro\')">'+ic('right',15)+'<span>بازگشت</span></button>' +
    '<button class="btn btn-primary" onclick="goStep(\'penalties\')"><span>مرحله بعد: جرایم</span>'+ic('left',15)+'</button></div></div>';
}

function renderStepPenalties(){
  var rows = relatedPenalties();
  var body = rows.length===0 ? '<p class="muted">با توجه به پاسخ‌های شما، جریمه‌ای برایتان شناسایی نشد.</p>' :
    rows.map(function(p){
      var s=S.wiz.selected[p.id]||{}; var extra='';
      if(s.checked && (p.calcType==='percent'||p.calcType==='permonth_percent')){ extra+='<div style="margin-right:24px;margin-top:8px;max-width:260px;"><label class="field"><span class="field-label">مبلغ پایه (تومان)</span><input type="number" value="'+esc(s.base||'')+'" oninput="setPenaltyInput(\''+p.id+'\',\'base\',this.value)" placeholder="مثلاً 20000000" /></label></div>'; }

function servicePlan(key){ return (CATALOG.servicePlans||[]).find(function(p){ return p.serviceKey===key; }); }
function servicePriceBadge(plan){
  if(!plan) return '';
  return plan.price===0 ? '<span class="badge badge-green">رایگان</span>' : '<span class="badge badge-gold">'+toman(plan.price)+'</span>';
}

async function ensureMyDataLoaded(){
  if (S.wiz.myDataLoaded || !S.authPhone) return;
  try{
    var r = await Api.me(S.authPhone);
    S.wiz.myAuditChecked = r.auditChecked || {};
    S.wiz.myReminders = r.reminders || [];
    S.wiz.myDataLoaded = true;
    if (r.refCode) S.myRefCode = r.refCode;
    apiStatus='online';
  }catch(e){ apiStatus='offline'; }
}

function renderServicesArea(){
  var view = S.wiz.serviceView;
  if (!view) return renderServicesHub();
  if (view==='chat') return renderServiceChat();
  if (!hasScopeAccess(view)) {
    return '<div class="card narrow">'+renderActivationBody({
      icon:'lock', title:'نیاز به فعال‌سازی این خدمت',
      desc:'برای استفاده از این خدمت، کد فعال‌سازی مخصوص آن را وارد کنید.',
      inputId:'serviceLicenseInput', submitFn:'submitServiceLicense', context:'service-'+view
    }) + '<div class="btn-row start"><button class="btn btn-ghost" onclick="go(\'wizard/services\')">'+ic('right',15)+'<span>بازگشت به خدمات</span></button></div></div>';
  }
  if (view==='upload') return renderServiceUpload();
  if (view==='case') return renderServiceCase();
  if (view==='reminder') return renderServiceReminder();
  if (view==='audit') return renderServiceAudit();
  return renderServicesHub();
}
async function submitServiceLicense(){
  var el=document.getElementById('serviceLicenseInput'); var code=el?el.value.trim():'';
  S.wiz.licenseChecking=true; render();
  try{
    var r = await Api.verifyLicense(code, S.authPhone); apiStatus='online';
    if (r.valid) { lsSet('license_ok', code); lsSet('license_scope', r.scope||['all']); S.wiz.licenseError=''; S.wiz.licenseChecking=false; render(); }
    else { S.wiz.licenseError = r.reason==='used_by_other' ? 'این کد قبلاً توسط شمارهٔ دیگری فعال شده و قابل استفادهٔ مجدد نیست.' : 'کد نامعتبر است.'; S.wiz.licenseChecking=false; render(); }
  }catch(e){ apiStatus='offline'; S.wiz.licenseChecking=false; S.wiz.licenseError='خطا در برقراری ارتباط با سرور.'; render(); }
}

function renderServicesHub(){
  var cards = [
    { key:'chat', icon:'search', title:'چت با منابع تخصصی', desc:'جست‌وجو در منابعی که کارشناسان ما تهیه کرده‌اند — نه هوش مصنوعی آزاد.', freeNote:true },
    { key:'upload', icon:'doc', title:'مشاورهٔ آنلاین با بررسی مدارک', desc:'برگ تشخیص یا مدارک خود را برای بررسی کارشناس آپلود کنید.' },

    { key:'reminder', icon:'calendar', title:'یادآور شخصی‌سازی‌شدهٔ مواعد', desc:'پیش از رسیدن موعد هر تکلیف، به شما اطلاع می‌دهیم.' },
    { key:'audit', icon:'check', title:'چک‌لیست حسابرسی داخلی', desc:'خودارزیابی سریع وضعیت رعایت تکالیف مالیاتی‌تان.' }

      '<div class="title" style="margin-top:8px;">'+esc(c.title)+'</div><div class="desc">'+esc(c.desc)+'</div></button>';
  }).join('');
  return '<div class="card"><div class="section-eyebrow">خدمات آنلاین</div><div class="section-title"><h2>چه کمکی نیاز دارید؟</h2></div>' +
    '<div class="grid2">'+html+'</div>' +
    '<div class="btn-row"><button class="btn btn-ghost" onclick="go(\'wizard/consult\')">'+ic('right',15)+'<span>بازگشت</span></button></div></div>';

function renderServiceChat(){
  if (S.wiz.kbRequireLicense) {
    return '<div class="card">'+renderServiceHeader('چت با منابع تخصصی', 'chat') +
      renderActivationBody({
        icon:'lock', title:'سقف سؤالات رایگان تمام شد',
        desc:'برای ادامهٔ چت با منابع تخصصی، اشتراک خود را فعال کنید.',
        inputId:'chatLicenseInput', submitFn:'submitChatLicense', context:'chat'
      }) + '</div>' + renderServiceBackBtn();
  }
  var resultsHtml = '';
  if (S.wiz.kbSearching) resultsHtml = '<p class="muted">در حال جست‌وجو...</p>';
  else if (S.wiz.kbAnswer) {
    var a = S.wiz.kbAnswer;
    if (!a.found) {
      resultsHtml = '<div class="alert-box error">'+ic('alert',14)+'<span>'+esc(a.message||'در منابع موجود پاسخی برای این سؤال یافت نشد.')+'</span></div>';
    } else if (a.grounded) {
      resultsHtml = '<div class="block"><div class="small-muted" style="margin-bottom:6px;">'+ic('shield',12,'var(--green)')+' پاسخ فقط بر اساس منابع (هوش مصنوعی رایگان)</div>' +
        '<div style="line-height:2;white-space:pre-wrap;">'+esc(a.answer)+'</div>' +
        (a.sources&&a.sources.length?'<div class="small-muted" style="margin-top:10px;">منابع: '+a.sources.map(function(s){return esc(s.title);}).join('، ')+'</div>':'') + '</div>';
    } else {
      resultsHtml = '<div class="stack">'+(a.results||[]).map(function(r){
        return '<div class="block"><div style="font-weight:800;font-size:13.5px;">'+esc(r.title)+'</div><div class="small-muted" style="margin-top:6px;line-height:1.9;">'+esc(r.content)+'</div></div>';
      }).join('')+'</div>';
    }
  }
  var remainNote = (S.wiz.kbRemaining!=null && !hasScopeAccess('chat')) ? '<div class="small-muted" style="margin-top:10px;">'+toFa(S.wiz.kbRemaining)+' سؤال رایگان دیگر باقی مانده.</div>' : '';
  return '<div class="card">'+renderServiceHeader('چت با منابع تخصصی', 'chat') +
    '<div class="alert-box info" style="margin-bottom:14px;">'+ic('info',14)+'<span>این بخش فقط در منابعی که کارشناسان ما تهیه کرده‌اند پاسخ می‌جوید و چیزی از خودش نمی‌سازد؛ اگر پاسخ در منابع نباشد، همین را به شما می‌گوید.</span></div>' +
    '<div class="search-wrap" style="margin-bottom:14px;"><span class="search-icon">'+ic('search',15)+'</span><input type="text" value="'+esc(S.wiz.kbQuery)+'" oninput="S.wiz.kbQuery=this.value" onkeydown="if(event.key===\'Enter\')doKbSearch();" placeholder="مثلاً: گروه‌بندی مودیان" /></div>' +
    '<button class="btn btn-gold btn-sm" style="margin-bottom:16px;" '+(S.wiz.kbSearching?'disabled':'')+' onclick="doKbSearch()">'+ic('search',13)+'<span>پرسیدن</span></button>' +
    resultsHtml + remainNote + '</div>' + renderServiceBackBtn();
}
async function doKbSearch(){
  if (!S.wiz.kbQuery || !S.wiz.kbQuery.trim()) return;
  S.wiz.kbSearching = true; S.wiz.kbAnswer=null; render();
  try{
    var r = await Api.kbAnswer(S.wiz.kbQuery, S.authPhone, hasScopeAccess('chat'));
    apiStatus='online';
    if (r.requireLicense) { S.wiz.kbRequireLicense = true; }
    else { S.wiz.kbAnswer = r; S.wiz.kbRemaining = r.remaining; }
  }catch(e){ apiStatus='offline'; S.wiz.kbAnswer = { found:false, message:'خطا در برقراری ارتباط با سرور.' }; }
  S.wiz.kbSearching = false; render();
}
async function submitChatLicense(){
  var el=document.getElementById('chatLicenseInput'); var code=el?el.value.trim():'';
  S.wiz.licenseChecking = true; render();
  try{
    var r = await Api.verifyLicense(code, S.authPhone); apiStatus='online';
    if (r.valid) { lsSet('license_ok', code); lsSet('license_scope', r.scope||['all']); S.wiz.licenseError=''; S.wiz.kbRequireLicense=false; S.wiz.licenseChecking=false; render(); }
    else { S.wiz.licenseError = r.reason==='used_by_other' ? 'این کد قبلاً توسط شمارهٔ دیگری فعال شده و قابل استفادهٔ مجدد نیست.' : 'کد نامعتبر است.'; S.wiz.licenseChecking=false; render(); }
  }catch(e){ apiStatus='offline'; S.wiz.licenseChecking=false; S.wiz.licenseError='خطا در برقراری ارتباط با سرور.'; render(); }
}

function onSvcFileSelected(el){
  var file = el.files && el.files[0];
  if (!file) return;
  if (file.size > 4*1024*1024) { S.wiz.svcForm.uploadError = 'حجم فایل نباید بیشتر از ۴ مگابایت باشد.'; render(); return; }
  S.wiz.svcForm.uploadError = '';
  S.wiz.svcForm.uploading = true; render();
  var reader = new FileReader();
  reader.onload = async function(){
    try{
      var base64 = reader.result.split(',')[1];
      var r = await Api.upload(file.name, file.type||'application/octet-stream', base64);
      S.wiz.svcForm.fileId = r.fileId; S.wiz.svcForm.fileName = file.name;
      apiStatus='online';
    }catch(e){
      apiStatus='offline';
      S.wiz.svcForm.uploadError = 'آپلود فایل ناموفق بود. دوباره تلاش کنید.';
    }
    S.wiz.svcForm.uploading = false; render();
  };
  reader.readAsDataURL(file);
}

  var f = S.wiz.svcForm;

  try{

async function tryAdminLogin(){
  var el=document.getElementById('adminPassInput'), val=el?el.value:'';
  S.adminLoading = true; S.adminLoginError=''; render();
  try{
    var res = await Api.adminLogin(val);
    apiStatus='online';
    S.adminToken = res.token;
    lsSet('admin_token', res.token);
    var data = await Api.adminGetData(res.token);
    S.adminData = data;
    S.adminAuthed = true; S.adminLoading=false;
    go('admin/dashboard');
  }catch(e){
    apiStatus = (e && e.status) ? 'online' : 'offline';
    S.adminLoading=false;
    S.adminLoginError = (e && e.status===401) ? 'رمز اشتباه است.' : 'خطا در برقراری ارتباط با سرور.';
    render();
  }
}
function logoutAdmin(){ S.adminAuthed=false; S.adminToken=null; S.adminData=null; lsDel('admin_token'); go(''); }

async function tryRestoreAdminSession(){
  var tok = lsGet('admin_token');
  if (!tok) return;
  try{
    var data = await Api.adminGetData(tok);
    S.adminToken = tok; S.adminData = data; S.adminAuthed = true;
  }catch(e){ lsDel('admin_token'); }
}

async function saveAdminData(){
  try{
    await Api.adminPutData(S.adminToken, S.adminData);
    apiStatus='online';
    return true;
  }catch(e){
    apiStatus='offline';
    if (e && e.status===401) { S.adminAuthed=false; lsDel('admin_token'); go(''); }
    return false;
  }
}
async function persistAndRender(successMsg){
  var ok = await saveAdminData();
  if (!ok) alert('⚠️ ذخیره روی سرور ناموفق بود. اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.');
  render();
  return ok;
}

  if(!confirm('این سوال حذف شود؟ گزینه‌های سایر سوالات که به این سوال اشاره می‌کنند باید دستی اصلاح شوند.')) return;
  S.adminData.questions = S.adminData.questions.filter(function(x){return x.id!==id;});
  Object.keys(S.adminData.meta.rootQuestion||{}).forEach(function(k){ if(S.adminData.meta.rootQuestion[k]===id) S.adminData.meta.rootQuestion[k]=''; });

async function saveQuestionForm(){
  if(!S.form.text.trim()){ alert('متن سوال را وارد کنید.'); return; }

  if(exists){ alert('این شناسه تکراری است.'); return; }
  if(S.formMode==='add'){ S.adminData.questions.push(S.form); }
  else { S.adminData.questions = S.adminData.questions.map(function(x){ return x.id===S.formId?S.form:x; }); }

  await persistAndRender();
}
async function setRootQuestion(personType, qId){
  S.adminData.meta.rootQuestion = S.adminData.meta.rootQuestion || {};

}

async function onKbExtractFile(kind, inputEl){
  var file = inputEl.files && inputEl.files[0];

}

// ---- کتابخانه‌های استخراج متن — فقط هنگام نیاز، از CDN بارگذاری می‌شوند ----
var __loadedScripts = {};
function loadScript(src){
  if (__loadedScripts[src]) return __loadedScripts[src];
  __loadedScripts[src] = new Promise(function(resolve, reject){
    var s = document.createElement('script');
    s.src = src; s.onload = function(){ resolve(); }; s.onerror = function(){ reject(new Error('بارگذاری کتابخانه ناموفق بود.')); };
    document.head.appendChild(s);
  });
  return __loadedScripts[src];
}
async function extractPdfText(file){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
  var buf = await file.arrayBuffer();
  var pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
  var text = '';
  for (var i=1; i<=pdf.numPages; i++){
    var page = await pdf.getPage(i);
    var content = await page.getTextContent();
    text += content.items.map(function(it){ return it.str; }).join(' ') + '\n\n';
  }
  return text.trim();
}
async function extractExcelText(file){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  var buf = await file.arrayBuffer();
  var wb = window.XLSX.read(buf, { type:'array' });
  var out = [];
  wb.SheetNames.forEach(function(name){
    out.push('--- '+name+' ---\n'+window.XLSX.utils.sheet_to_csv(wb.Sheets[name]));
  });
  return out.join('\n\n').trim();
}
async function extractImageText(file){
  await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  var result = await window.Tesseract.recognize(file, 'fas+eng');
  return ((result && result.data && result.data.text) || '').trim();
}

function downloadJson(filename, data){
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function downloadCurrentBackup(){
  downloadJson('maliyar-backup-'+(new Date().toISOString().slice(0,10))+'.json', S.adminData);
}
async function loadBackupsList(){
  S.backupsLoading = true; S.backupsError = ''; render();

    var res = await Api.adminBackups(S.adminToken);
    S.backupsList = res.backups || [];
  }catch(e){ S.backupsError = 'دریافت فهرست نسخه‌های پشتیبان ناموفق بود.'; }
  S.backupsLoading = false; render();
}
async function downloadBackupByKey(key){
  try{
    var data = await Api.adminBackupGet(S.adminToken, key);
    downloadJson(key.replace(/[:/]/g,'-')+'.json', data);

}
async function restoreBackup(key){

  S.backupsLoading = true; render();
  try{
    await Api.adminRestore(S.adminToken, key);
    alert('بازگردانی انجام شد.');

    var data = await Api.adminGetData(S.adminToken);

  S.backupsLoading = false; render();
}

  m.reminderSettings.smsSender = vals.smsSenderInput||'';
  m.reminderSettings.smsProvider = 'kavenegar';
  m.allowedFetchHosts = (vals.allowedFetchHostsInput||'').split(',').map(function(s){return s.trim().toLowerCase();}).filter(Boolean);
  await persistAndRender();
  S.settingsSaved=true; render(); setTimeout(function(){ S.settingsSaved=false; render(); },1800);
}

function renderGuideAdmin(){
  return '<div class="card"><div class="section-title tight"><h2>📖 راهنما</h2></div>' +
    '<div class="block"><div style="font-weight:800;">۱. معماری</div><div class="small-muted">همهٔ داده‌ها یک بلاک JSON در Cloudflare KV است. فرانت‌اند (این صفحه، روی گیت‌هاب) فقط با API که روی Cloudflare Worker است صحبت می‌کند.</div></div>' +
    '<div class="block"><div style="font-weight:800;">۲. تغییر رمز مدیریت</div><div class="small-muted">در پنل Cloudflare → Worker → Settings → Variables and Secrets → مقدار <code class="tpl-var">ADMIN_PASSWORD</code> را تغییر دهید.</div></div>' +
    '<div class="block"><div style="font-weight:800;">۳. درخت سوالات</div><div class="small-muted">در تب «درخت سوالات» برای هر سوال، بعد از هر پاسخ می‌توانید «سوال بعدی» و «تکالیفی که فعال می‌شود» را تعیین کنید. اگر «سوال بعدی» خالی بماند، مسیر پایان می‌یابد و کاربر مستقیم به صفحهٔ تکالیف می‌رود.</div></div>' +
    '<div class="block"><div style="font-weight:800;">۴. راهنمای کامل نصب</div><div class="small-muted">فایل <code class="tpl-var">README.md</code> همراه این پروژه را ببینید.</div></div></div>';
}

// ============================================================
// فرم‌های عمومی (تکالیف/جرایم/قالب/بسته)
// ============================================================
var EMPTY_MAKERS={
  obligation:function(){ return {id:genId('o'), title:'', appliesTo:['حقیقی','حقوقی'], fixed:false, description:'', deadline:'', reminderAfterDays:20, penaltyIds:[]}; },
  penalty:function(){ return {id:genId('p'), title:'', description:'', calcType:'fixed', value:0, amnestyEligible:false, amnestyPercent:0, amnestyCondition:'', installmentEligible:false, maxInstallments:1, legalArticle:''}; },
  template:function(){ return {id:genId('t'), title:'', body:''}; },
  plan:function(){ return {id:genId('pl'), title:'', price:0, duration:'', desc:''}; },
  kbItem:function(){ return {id:genId('kb'), title:'', keywords:[], content:'', sourceType:'text', sourceName:'', sourceUrl:''}; },
  auditItem:function(){ return {id:genId('ac'), title:''}; }
};
var COLL_KEY={obligation:'obligations', penalty:'penalties', template:'templates', plan:'plans', kbItem:'knowledgeBase', auditItem:'auditChecklist'};

function openAddForm(type){ S.formType=type; S.formMode='add'; S.formId=null; S.form=EMPTY_MAKERS[type](); render(); window.scrollTo(0,0); }
function openEditForm(type,id){ var coll=S.adminData[COLL_KEY[type]]; var item=coll.find(function(x){return x.id===id;}); if(!item) return; S.formType=type; S.formMode='edit'; S.formId=id; S.form=clone(item); render(); window.scrollTo(0,0); }
async function deleteItem(type,id){ if(!confirm('حذف شود؟')) return; var key=COLL_KEY[type]; S.adminData[key]=S.adminData[key].filter(function(x){return x.id!==id;}); await persistAndRender(); }
async function saveForm(){
  var key=COLL_KEY[S.formType];
  if((S.formType==='obligation'||S.formType==='penalty'||S.formType==='template'||S.formType==='plan'||S.formType==='kbItem'||S.formType==='auditItem') && !S.form.title.trim()){ alert('عنوان را وارد کنید.'); return; }
  if(S.formType==='plan'){ S.form.price=Number(S.form.price)||0; }
  if(S.formType==='penalty'){ S.form.value=Number(S.form.value)||0; S.form.amnestyPercent=Number(S.form.amnestyPercent)||0; S.form.maxInstallments=Number(S.form.maxInstallments)||1; }
  if(S.formType==='obligation'){ S.form.reminderAfterDays=Number(S.form.reminderAfterDays)||20; }
  if(S.formMode==='add'){ S.adminData[key].push(S.form); }
  else { S.adminData[key]=S.adminData[key].map(function(x){ return x.id===S.formId?S.form:x; }); }
  cancelForm();
  await persistAndRender();
}
function toggleAppliesTo(kind){ var arr=S.form.appliesTo||[]; var idx=arr.indexOf(kind); if(idx===-1) arr=arr.concat([kind]); else arr=arr.filter(function(x){return x!==kind;}); S.form.appliesTo=arr; render(); }
function toggleMultiId(field,id){ var arr=S.form[field]||[]; var idx=arr.indexOf(id); if(idx===-1) arr=arr.concat([id]); else arr=arr.filter(function(x){return x!==id;}); S.form[field]=arr; render(); }
function renderMultiCheck(allItems, selectedIds, field){
  return '<div class="multi-check">'+allItems.map(function(item){
    var checked=(selectedIds||[]).indexOf(item.id)!==-1;
    return '<label class="checkbox-row"><input type="checkbox" '+(checked?'checked':'')+' onchange="toggleMultiId(\''+field+'\',\''+item.id+'\')" /><span>'+esc(item.title||item.text)+'</span></label>';
  }).join('')+'</div>';
}

// ============================================================
// راه‌اندازی برنامه
// ============================================================
async function boot(){
  onRoute();
  capturePendingReferral();
  restoreAuthSession();
  initPwaInstall();
  registerServiceWorker();
  render();

  try{
    CATALOG = await Api.getData();
    apiStatus = 'online';
  }catch(e){
    apiStatus = 'offline';
  }

  if (S.route === 'admin') {
    await tryRestoreAdminSession();
  }

  if (!S.wiz.lead.planId && CATALOG.plans && CATALOG.plans[0]) S.wiz.lead.planId = CATALOG.plans[0].id;
  if (!S.wiz.templateId && CATALOG.templates && CATALOG.templates[0]) S.wiz.templateId = CATALOG.templates[0].id;

  render();
}

if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
</script>
